<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080d"><title>LIVE // EARTH — Explorer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>:root{color-scheme:dark;--glass:rgba(7,14,23,.9);--line:rgba(170,205,230,.2);--text:#eaf5ff;--muted:#9db1c5}*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0}body{background:#05080d;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}#map{position:absolute;inset:0;background:#0a111b}.bar{position:absolute;z-index:900;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}.glass{background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:11px 13px;backdrop-filter:blur(18px)}button{color:var(--text);font-size:12px;background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:11px}.bottom{position:absolute;z-index:900;bottom:calc(env(safe-area-inset-bottom) + 14px);left:12px;right:12px;color:var(--muted);font-size:11px;line-height:1.5}.bottom strong{display:block;color:var(--text);font-size:13px;margin-bottom:3px}.leaflet-control-attribution{font-size:9px!important;background:#06101bd9!important;color:#a9bdcf!important}.leaflet-control-attribution a{color:#9bdcff!important}.leaflet-control-zoom a{background:#08121fe8!important;color:#eaf5ff!important;border-color:var(--line)!important}.marker{width:18px;height:18px;border-radius:50%;background:#ff334d;border:2px solid white;box-shadow:0 0 0 5px #ff334d2b,0 0 18px #ff334dcc}</style></head><body><div id="map" aria-label="Interactive map"></div><div class="bar"><div class="glass">LIVE <span style="color:#66d7ff">//</span> EARTH</div><button id="locate">Locate me</button><button id="back">← Home</button></div><div class="bottom glass"><strong id="heading">Basic Live</strong><span id="details">Interactive 2D map · pan and zoom.</span></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>(()=>{const q=new URLSearchParams(location.search),mode=q.get('mode')||'basic',heading=document.querySelector('#heading'),details=document.querySelector('#details');if(mode==='hd'){heading.textContent='HD Live · preview';details.textContent='This entry uses the available 2D map. HD imagery and 3D buildings are not connected yet.'}if(mode==='offline'){heading.textContent='Offline · limited shell';details.textContent='No GPS or online tile requests. Offline map tiles are not bundled.'}const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([20,0],2);L.control.zoom({position:'bottomright'}).addTo(map);if(mode!=='offline')L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);let marker=null,busy=false;function locate(){if(mode==='offline'){heading.textContent='Offline mode';details.textContent='Live location is not requested in Offline mode.';return}if(localStorage.getItem('liveEarthLocationEnabled')!=='true'){heading.textContent='Location is OFF';details.textContent='Tap the red Location orb on Home to enable live location.';return}if(busy||!navigator.geolocation)return;busy=true;heading.textContent='Finding location…';navigator.geolocation.getCurrentPosition(p=>{busy=false;if(marker)map.removeLayer(marker);marker=L.marker([p.coords.latitude,p.coords.longitude],{icon:L.divIcon({className:'',html:'<div class="marker"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);map.setView([p.coords.latitude,p.coords.longitude],15);heading.textContent='Explorer located';details.textContent='Location shown for this session.'},()=>{busy=false;heading.textContent='Location unavailable';details.textContent='Could not determine location; explore manually.'},{enableHighAccuracy:false,timeout:12000,maximumAge:120000})}document.querySelector('#locate').onclick=locate;document.querySelector('#back').onclick=()=>location.href='./';if(q.get('locate')==='1')locate()})();</script></body></html>
