<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>LIVE // EARTH — Location</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{color-scheme:dark;--bg:#05080d;--glass:rgba(7,14,23,.88);--line:rgba(170,205,230,.2);--text:#eaf5ff;--muted:#9db1c5;--red:#ff334d}
*{box-sizing:border-box}
html,body,#map{height:100%;width:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
#map{position:absolute;inset:0;background:#0a111b}
.topbar{position:absolute;z-index:900;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 28px #0007,inset 0 1px #ffffff0b;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:16px}
.brand{padding:11px 14px;letter-spacing:.13em;font-size:12px;font-weight:800;pointer-events:auto}
.brand span{color:#66d7ff}
.action{color:var(--text);border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:11px 13px;font-size:12px;font-weight:650;pointer-events:auto;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.bottom{position:absolute;z-index:900;bottom:calc(env(safe-area-inset-bottom) + 14px);left:12px;right:12px;padding:13px 15px;display:flex;align-items:center;gap:12px}
.dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#7f95a9;box-shadow:0 0 12px currentColor}
#statusTitle{font-size:13px;font-weight:700;margin-bottom:3px}
#statusText{font-size:11px;line-height:1.45;color:var(--muted)}
.leaflet-control-attribution{font-size:9px!important;background:#06101bd9!important;color:#a9bdcf!important}
.leaflet-control-attribution a{color:#9bdcff!important}
.leaflet-control-zoom{border:1px solid var(--line)!important;box-shadow:none!important}
.leaflet-control-zoom a{background:#08121fe8!important;color:#eaf5ff!important;border-color:var(--line)!important}
.leaflet-control-container{filter:drop-shadow(0 2px 7px #0008)}
/* Gentle cinematic location arrival: one sweep and one pulse, then it disappears. */
#scanFX{position:absolute;z-index:700;inset:0;pointer-events:none;overflow:hidden;opacity:0}
#scanFX.active{opacity:1}
.scanBeam{position:absolute;left:0;right:0;top:-20%;height:20%;opacity:0;background:linear-gradient(180deg,transparent,rgba(255,42,67,.015) 20%,rgba(255,50,75,.18) 48%,rgba(255,70,85,.06) 70%,transparent);border-bottom:1px solid rgba(255,70,90,.38);box-shadow:0 8px 26px rgba(255,30,55,.10);animation:sweep 1.65s cubic-bezier(.2,.7,.25,1) forwards}
.scanGrid{position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,transparent 49.8%,rgba(255,60,80,.07) 50%,transparent 50.2%);animation:softReveal .55s ease-out forwards}
@keyframes sweep{0%{top:-20%;opacity:0}12%{opacity:.9}85%{opacity:.6}100%{top:110%;opacity:0}}
@keyframes softReveal{0%{opacity:0}30%{opacity:.5}100%{opacity:0}}
#arrivalToast{position:absolute;z-index:950;left:50%;top:calc(env(safe-area-inset-top) + 76px);transform:translate(-50%,-8px);padding:10px 14px;max-width:calc(100vw - 28px);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;font-size:11px;letter-spacing:.09em;color:#ffe9ec}
#arrivalToast.show{opacity:1;transform:translate(-50%,0)}
.userMarker{width:18px;height:18px;border-radius:50%;background:#ff334d;border:2px solid #fff;box-shadow:0 0 0 5px #ff334d2b,0 0 18px #ff334dcc;position:relative}
.userMarker:after{content:"";position:absolute;inset:-8px;border:1px solid #ff5367;border-radius:50%;animation:markerPulse 1.8s ease-out 2}
@keyframes markerPulse{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.65);opacity:0}}
@media(prefers-reduced-motion:reduce){.scanBeam,.scanGrid,.userMarker:after{animation:none!important}.scanBeam{display:none!important}#arrivalToast{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label="Basic interactive map"></div>
<div id="scanFX" aria-hidden="true"><div class="scanGrid"></div><div class="scanBeam"></div></div>
<div id="arrivalToast" class="glass">LOCATION ACQUIRED · WELCOME HOME</div>
<div class="topbar">
  <div class="brand glass">LIVE <span>//</span> EARTH</div>
  <button id="locateAgain" class="action" type="button">Locate me</button>
  <button id="backHome" class="action" type="button">← Home</button>
</div>
<div class="bottom glass" role="status" aria-live="polite">
  <span id="statusDot" class="dot"></span>
  <div><div id="statusTitle">Basic map</div><div id="statusText">Explore the map by moving and zooming. Live location is optional.</div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const wantsLocate = params.get('locate') === '1';
  const map = L.map('map',{zoomControl:false,preferCanvas:true}).setView([20,0],2);
  L.control.zoom({position:'bottomright'}).addTo(map);
  // OpenStreetMap standard tiles are online-only and subject to the tile usage policy.
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  }).addTo(map);
  const statusTitle=document.querySelector('#statusTitle');
  const statusText=document.querySelector('#statusText');
  const dot=document.querySelector('#statusDot');
  const scan=document.querySelector('#scanFX');
  const toast=document.querySelector('#arrivalToast');
  let marker=null, scanTimer=null, toastTimer=null, locating=false;
  function setStatus(title,text,color='#7f95a9'){
    statusTitle.textContent=title;statusText.textContent=text;dot.style.background=color;dot.style.color=color;dot.style.boxShadow='0 0 12px '+color;
  }
  function arrival(lat,lon,accuracy){
    if(marker)map.removeLayer(marker);
    const icon=L.divIcon({className:'',html:'<div class="userMarker"></div>',iconSize:[18,18],iconAnchor:[9,9]});
    marker=L.marker([lat,lon],{icon,keyboard:true,title:'Your current location'}).addTo(map);
    map.setView([lat,lon],Math.max(14,Math.min(16,map.getZoom())),{animate:true,duration:.8});
    setStatus('Explorer located','Your device provided a location fix. You can continue exploring manually.','#ff5268');
    scan.classList.remove('active');void scan.offsetWidth;scan.classList.add('active');
    toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');
    clearTimeout(scanTimer);clearTimeout(toastTimer);
    scanTimer=setTimeout(()=>scan.classList.remove('active'),1900);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),2400);
  }
  function locate(){
    if(locating)return;
    if(!navigator.geolocation){
      setStatus('Live location unavailable','Your browser does not provide location services. The map is still available.');return;
    }
    locating=true;
    setStatus('Finding your location…','Waiting for your device. The map remains available meanwhile.','#ff5268');
    navigator.geolocation.getCurrentPosition(pos=>{
      locating=false;
      arrival(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);
    },err=>{
      locating=false;
      if(err.code===1)setStatus('Map ready','Location permission was not granted. Explore the map normally.');
      else if(err.code===2)setStatus('Map ready','Your location could not be determined. You can browse the map or try again.');
      else setStatus('Map ready','Location lookup timed out. You can browse the map or try again.');
    },{enableHighAccuracy:false,timeout:12000,maximumAge:120000});
  }
  document.querySelector('#locateAgain').addEventListener('click',locate);
  document.querySelector('#backHome').addEventListener('click',()=>location.href='./');
  // Map always opens first. Permission is requested only after explicit intent from the orb.
  if(wantsLocate)locate();
  window.addEventListener('pageshow',()=>setTimeout(()=>map.invalidateSize(),100));
})();
</script>
</body>
</html>
