<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
<title id="title">LIVE // EARTH — Moonless Cinematic Environment Prototype</title>
<desc id="desc">A moonless, richly layered blue night landscape with stars, atmospheric clouds, distant mountain ridges, mist, a reflective lake, and foreground pines. The upper sky is intentionally left open for a separately rendered Moon and Lunar Arc.</desc>
<defs>
  <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#020611"/><stop offset=".28" stop-color="#07162d"/><stop offset=".58" stop-color="#102d4e"/><stop offset=".78" stop-color="#254a6b"/><stop offset="1" stop-color="#081729"/>
  </linearGradient>
  <radialGradient id="skyBloom" cx="50%" cy="50%" r="50%">
    <stop stop-color="#79b9e8" stop-opacity=".24"/><stop offset=".42" stop-color="#397eb8" stop-opacity=".12"/><stop offset="1" stop-color="#1b4775" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="farRidge" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#5b83a6"/><stop offset=".42" stop-color="#294a6d"/><stop offset="1" stop-color="#10243d"/>
  </linearGradient>
  <linearGradient id="midRidge" x1="0" y1="0" x2=".1" y2="1">
    <stop stop-color="#234568"/><stop offset=".52" stop-color="#102844"/><stop offset="1" stop-color="#061427"/>
  </linearGradient>
  <linearGradient id="nearRidge" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#0c2038"/><stop offset="1" stop-color="#020914"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#9bcff2" stop-opacity=".48"/><stop offset=".16" stop-color="#477fa8" stop-opacity=".33"/><stop offset=".58" stop-color="#17416a" stop-opacity=".22"/><stop offset="1" stop-color="#020915" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shoreGlow" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#ffc982" stop-opacity="0"/><stop offset=".5" stop-color="#ffc982" stop-opacity=".8"/><stop offset="1" stop-color="#ffc982" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="cloudShade" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#8bb8dc" stop-opacity=".32"/><stop offset="1" stop-color="#1d4266" stop-opacity=".02"/>
  </linearGradient>
  <radialGradient id="mist" cx="50%" cy="50%" r="50%">
    <stop stop-color="#9dc8e8" stop-opacity=".22"/><stop offset="1" stop-color="#8db9df" stop-opacity="0"/>
  </radialGradient>
  <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>
  <filter id="smallBlur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <g id="stars" fill="#d8edff">
    <circle cx="54" cy="82" r="2.1"/><circle cx="121" cy="194" r="1.2"/><circle cx="192" cy="113" r="1.6"/>
    <circle cx="260" cy="66" r="1.1"/><circle cx="324" cy="226" r="1.8"/><circle cx="385" cy="143" r="1.1"/>
    <circle cx="446" cy="91" r="1.5"/><circle cx="513" cy="185" r="1.1"/><circle cx="571" cy="62" r="2"/>
    <circle cx="633" cy="137" r="1.1"/><circle cx="696" cy="88" r="1.6"/><circle cx="762" cy="215" r="1.2"/>
    <circle cx="818" cy="116" r="1.9"/><circle cx="884" cy="66" r="1.1"/><circle cx="946" cy="170" r="1.6"/>
    <circle cx="88" cy="300" r="1.3"/><circle cx="235" cy="340" r="1.1"/><circle cx="405" cy="292" r="1.5"/>
    <circle cx="604" cy="330" r="1.1"/><circle cx="775" cy="310" r="1.4"/><circle cx="916" cy="380" r="1.1"/>
  </g>
  <g id="pine" fill="#020812">
    <path d="M0 100 L-24 143 -11 143 -34 179 -18 179 -45 222 45 222 18 179 34 179 11 143 24 143Z"/>
  </g>
</defs>

<style>
  .portrait { display:inline; }
  .landscape { display:none; }
  @media (orientation: landscape) {
    .portrait { display:none; }
    .landscape { display:inline; }
  }
</style>

<!-- PORTRAIT COMPOSITION -->
<g class="portrait">
  <rect width="1000" height="1600" fill="url(#nightSky)"/>
  <ellipse cx="510" cy="420" rx="600" ry="440" fill="url(#skyBloom)"/>
  <g opacity=".82"><use href="#stars" x="0" y="0"/><use href="#stars" x="40" y="245" opacity=".48"/></g>
  <!-- distant star haze, intentionally not a moon or moon-shaped object -->
  <path d="M120 350 Q290 270 430 330 T720 310 T1010 345" fill="none" stroke="#8bbbe8" stroke-opacity=".08" stroke-width="44" filter="url(#softBlur)"/>
  <!-- layered cloud banks with softly blurred atmospheric edges -->
  <g filter="url(#smallBlur)" opacity=".65" fill="#6b9bc4">
    <path d="M-60 525 Q35 455 105 488 T230 480 Q285 420 345 462 T470 475 Q525 450 600 495 L650 550 Q510 530 420 558 T210 560 T-60 590Z"/>
    <path d="M440 600 Q520 548 590 578 T730 565 Q795 505 850 548 T1030 560 L1050 635 Q890 620 790 646 T600 638 T440 660Z"/>
  </g>
  <path d="M-40 600 Q55 548 120 585 T255 575 Q310 530 380 568 T515 580 Q570 550 640 592 Q700 630 760 590 T910 575 L1040 620 L1040 690 Q900 660 800 690 T600 680 T390 710 T150 690 T-40 725Z" fill="url(#cloudShade)"/>
  <path d="M0 910 L80 815 145 858 225 740 285 820 365 765 435 850 510 760 575 842 660 720 730 810 805 770 885 845 950 790 1000 820 1000 1180 0 1180Z" fill="url(#farRidge)"/>
  <path d="M0 1015 L75 945 155 1000 240 900 310 975 390 925 470 1010 555 900 625 970 700 915 775 995 855 925 930 975 1000 930 1000 1260 0 1260Z" fill="url(#midRidge)"/>
  <path d="M0 1120 L95 1040 170 1100 260 1015 340 1115 420 1055 510 1140 590 1035 675 1110 760 1040 850 1135 930 1065 1000 1100 1000 1600 0 1600Z" fill="url(#nearRidge)"/>
  <!-- drifting mist between ridge layers -->
  <ellipse cx="485" cy="1120" rx="510" ry="70" fill="url(#mist)" filter="url(#softBlur)"/>
  <ellipse cx="720" cy="1195" rx="390" ry="55" fill="url(#mist)" opacity=".8" filter="url(#softBlur)"/>
  <!-- lake and a soft, broken reflection corridor -->
  <path d="M390 1130 Q500 1100 610 1135 Q560 1220 625 1300 Q555 1390 620 1600 L365 1600 Q430 1415 370 1310 Q445 1220 390 1130Z" fill="url(#lake)"/>
  <g stroke="#b8e1ff" stroke-linecap="round" fill="none" opacity=".42">
    <path d="M443 1190 Q500 1184 558 1192" stroke-width="2.2"/><path d="M421 1220 Q500 1214 580 1222" stroke-width="1.5"/>
    <path d="M438 1252 Q500 1248 566 1254" stroke-width="2"/><path d="M405 1290 Q500 1283 594 1292" stroke-width="1.3"/>
    <path d="M432 1332 Q500 1327 571 1335" stroke-width="1.8"/><path d="M390 1374 Q500 1367 610 1376" stroke-width="1.2"/>
  </g>
  <!-- warm settlement lights, small and restrained -->
  <g fill="#ffd6a0">
    <circle cx="105" cy="1270" r="2.4"/><circle cx="130" cy="1254" r="1.7"/><circle cx="162" cy="1281" r="2"/>
    <circle cx="820" cy="1248" r="2.1"/><circle cx="854" cy="1264" r="1.6"/><circle cx="892" cy="1242" r="2.2"/>
    <circle cx="240" cy="1348" r="1.7"/><circle cx="770" cy="1330" r="1.9"/>
  </g>
  <g stroke="#ffcf8e" stroke-width="1" opacity=".25"><path d="M105 1274v18 M162 1285v13 M820 1252v20 M892 1246v18"/></g>
  <path d="M0 1430 Q120 1370 220 1450 T430 1440 T660 1460 T850 1425 T1000 1445 L1000 1600 0 1600Z" fill="#01050c" opacity=".58"/>
  <g><use href="#pine" transform="translate(55 1360) scale(1.1)"/><use href="#pine" transform="translate(120 1400) scale(.75)"/><use href="#pine" transform="translate(900 1375) scale(1.15)"/><use href="#pine" transform="translate(965 1410) scale(.78)"/></g>
</g>

<!-- LANDSCAPE COMPOSITION: intentionally wider horizon and different sky balance -->
<g class="landscape">
  <rect width="1000" height="1600" fill="url(#nightSky)"/>
  <ellipse cx="520" cy="370" rx="650" ry="390" fill="url(#skyBloom)"/>
  <g opacity=".82"><use href="#stars" x="0" y="0"/><use href="#stars" x="20" y="240" opacity=".42"/></g>
  <path d="M-40 520 Q100 460 210 500 T430 490 T650 510 T1040 485" fill="none" stroke="#83b8e8" stroke-opacity=".08" stroke-width="48" filter="url(#softBlur)"/>
  <g filter="url(#smallBlur)" opacity=".62" fill="#6b9bc4">
    <path d="M-50 570 Q70 500 145 535 T290 525 Q360 470 425 510 T565 525 L620 590 Q450 565 320 595 T-50 630Z"/>
    <path d="M420 600 Q520 550 610 580 T780 560 Q845 500 900 548 T1050 565 L1050 640 Q900 620 770 650 T550 645 T420 660Z"/>
  </g>
  <path d="M0 830 L90 750 165 800 255 690 330 780 410 720 490 790 570 680 645 760 730 705 820 785 900 720 1000 770 1000 1120 0 1120Z" fill="url(#farRidge)"/>
  <path d="M0 970 L105 875 190 940 290 835 375 930 475 860 560 950 665 830 750 925 850 850 925 920 1000 875 1000 1220 0 1220Z" fill="url(#midRidge)"/>
  <path d="M0 1100 L100 1010 200 1080 300 985 400 1090 500 1000 600 1100 700 995 800 1090 900 1015 1000 1065 1000 1600 0 1600Z" fill="url(#nearRidge)"/>
  <ellipse cx="500" cy="1110" rx="580" ry="70" fill="url(#mist)" filter="url(#softBlur)"/>
  <path d="M0 1120 Q170 1080 330 1125 T650 1115 T1000 1120 L1000 1600 0 1600Z" fill="url(#lake)"/>
  <g stroke="#b8e1ff" stroke-linecap="round" fill="none" opacity=".35">
    <path d="M340 1160h320" stroke-width="2"/><path d="M285 1190h430" stroke-width="1.4"/>
    <path d="M365 1225h270" stroke-width="1.8"/><path d="M240 1260h520" stroke-width="1.2"/>
    <path d="M315 1300h370" stroke-width="1.5"/><path d="M180 1340h640" stroke-width="1"/>
  </g>
  <g fill="#ffd6a0">
    <circle cx="95" cy="1140" r="2"/><circle cx="128" cy="1127" r="1.5"/><circle cx="166" cy="1152" r="2"/>
    <circle cx="805" cy="1135" r="2"/><circle cx="845" cy="1150" r="1.5"/><circle cx="890" cy="1129" r="2"/>
    <circle cx="230" cy="1220" r="1.5"/><circle cx="760" cy="1210" r="1.7"/>
  </g>
  <path d="M0 1400 Q180 1340 330 1405 T660 1400 T1000 1385 L1000 1600 0 1600Z" fill="#01050c" opacity=".58"/>
  <g><use href="#pine" transform="translate(75 1350) scale(1.0)"/><use href="#pine" transform="translate(145 1390) scale(.72)"/><use href="#pine" transform="translate(875 1350) scale(1.0)"/><use href="#pine" transform="translate(950 1395) scale(.7)"/></g>
</g>
</svg>
