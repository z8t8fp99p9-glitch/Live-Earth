
name: LIVE // EARTH ZIP Auto Extractor

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"

permissions:
  contents: write

concurrency:
  group: live-earth-zip-extractor
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract uploaded ZIP safely
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import stat
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd()
          before = os.environ["PUSH_BEFORE"]
          after = os.environ["PUSH_AFTER"]

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", before, after],
              text=True
          ).splitlines()

          uploads = [
              name for name in changed
              if len(PurePosixPath(name).parts) == 1
              and name.lower().endswith(".zip")
              and (repo / name).is_file()
          ]

          if len(uploads) != 1:
              raise SystemExit("Upload one ZIP file at repository root.")

          archive = repo / uploads[0]

          if archive.stat().st_size > 100 * 1024 * 1024:
              raise SystemExit("ZIP exceeds 100 MB.")

          with zipfile.ZipFile(archive) as zf:
              entries = [
                  info for info in zf.infolist()
                  if not info.is_dir()
                  and info.filename != "UPLOAD_MANIFEST.json"
              ]

              if not entries:
                  raise SystemExit("ZIP contains no files.")

              if len(entries) > 5000:
                  raise SystemExit("Too many files in ZIP.")

              names = set()

              for info in entries:
                  name = info.filename
                  path = PurePosixPath(name)
                  mode = (info.external_attr >> 16) & 0xFFFF

                  if (
                      path.is_absolute()
                      or "\\" in name
                      or any(p in ("", ".", "..") for p in path.parts)
                      or path.parts[0] in (".git", ".github")
                      or path.suffix.lower() == ".zip"
                      or stat.S_ISLNK(mode)
                  ):
                      raise SystemExit(f"Unsafe ZIP entry: {name}")

                  if name in names:
                      raise SystemExit(f"Duplicate file: {name}")

                  names.add(name)

                  if info.file_size > 50 * 1024 * 1024:
                      raise SystemExit(f"File too large: {name}")

              with tempfile.TemporaryDirectory() as temp:
                  stage = Path(temp)

                  for info in entries:
                      target = stage.joinpath(*PurePosixPath(info.filename).parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(zf.read(info))

                  for info in entries:
                      parts = PurePosixPath(info.filename).parts
                      source = stage.joinpath(*parts)
                      target = repo.joinpath(*parts)
                      target.parent.mkdir(parents=True, exist_ok=True)

                      if target.is_symlink():
                          raise SystemExit(f"Refusing symlink: {info.filename}")

                      shutil.copy2(source, target)
                      print(f"Extracted: {info.filename}")

          archive.unlink()
          print("ZIP extraction completed.")

          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          ZIP_NAME=$(git diff HEAD^ HEAD --name-only -- '*.zip' | head -n 1)
          TITLE="Extract uploaded ZIP: ${ZIP_NAME%.zip}"

          git commit -m "$TITLE"
          git push origin HEAD:main
