name: LIVE // EARTH Global Database Cleaner

# ============================================================================
# INTERNAL-ONLY RESET WORKFLOW — READ BEFORE EDITING
# ============================================================================
# This workflow is manually triggered only. It is not part of the app and has
# no visitor-facing controls. It offers exactly three reset choices:
#   nature       = Nature only
#   alien-world  = Alien World only
#   both         = both views
#
# Each view has exactly THREE primary path targets in the Python cleaner:
#   Nature:     .publisher-data/nature/nature.sqlite3
#               .publisher-data/nature/media/
#               nature/published/
#   Alien World: .publisher-data/alien-world/alien-world.sqlite3
#                .publisher-data/alien-world/media/
#                alien-world/published/
#
# The cache deletion step separately removes only the matching main-branch
# Actions cache keys: nature-db-v1-* and/or alien-world-db-v1-*.
# It must never delete pip caches or any unrelated Actions cache.
#
# SAFETY SEQUENCE:
#   1. Require the exact typed phrase for the selected view(s).
#   2. Temporarily disable only the selected Collector/Publisher workflow(s).
#   3. Confirm no selected workflow run is queued or in progress.
#   4. Restore the latest matching view cache(s) to the clean runner.
#   5. Create a backup archive and upload it as a 3-day Actions artifact.
#   6. Only after backup upload succeeds, clear the three explicit paths.
#   7. Commit feed/asset deletions to main so the public output disappears.
#   8. Delete every selected view's matching main-branch Actions cache key.
#   9. Request a GitHub Pages rebuild.
#  10. Re-enable only workflows that this cleaner itself disabled.
#
# If a destructive step starts but cache deletion does not complete, the
# selected publisher workflow(s) intentionally remain disabled. This prevents
# an old cache from republishing stale data. Resolve the failed run/cache issue
# before manually re-enabling those workflow(s).
#
# FUTURE VIEW ADDITION — MANUAL CODE CHANGE ONLY:
# Add the new view in scripts/global_database_cleaner.py TARGETS, then add its
# workflow filename to the QUIESCE mapping below, add an actions/cache/restore
# step, add its exact cache prefix to the cache-deletion mapping, and add its
# published folder to the commit mapping. Keep all entries explicit. Do not
# introduce automatic discovery, shared caches, broad wildcard deletion, or
# an all-.publisher-data reset.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select exactly which view(s) to reset
        required: true
        type: choice
        options:
          - nature
          - alien-world
          - both
      confirm_reset:
        description: Type RESET NATURE, RESET ALIEN WORLD, or RESET BOTH exactly
        required: true
        type: string

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: live-earth-global-database-cleaner
  cancel-in-progress: false

jobs:
  reset:
    name: Back up, reset and verify selected view(s)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate confirmation and pause selected publisher workflow(s)
        id: quiesce
        uses: actions/github-script@v7
        with:
          script: |
            const target = context.payload.inputs.target;
            const confirmation = context.payload.inputs.confirm_reset;
            const expected = {
              nature: 'RESET NATURE',
              'alien-world': 'RESET ALIEN WORLD',
              both: 'RESET BOTH',
            };
            if (!Object.hasOwn(expected, target)) {
              throw new Error(`Unsupported reset target: ${target}`);
            }
            if (confirmation !== expected[target]) {
              throw new Error(`Confirmation did not match. For ${target}, type exactly: ${expected[target]}`);
            }

            // =================================================================
            // FUTURE VIEW ADDITION: add the new view's exact workflow filename
            // here. Never use broad wildcard workflow disabling.
            // =================================================================
            const QUIESCE = {
              nature: 'nature-publisher.yml',
              'alien-world': 'alien-world-publisher.yml',
            };
            const selected = target === 'both'
              ? ['nature', 'alien-world']
              : [target];

            // Read all selected workflow states first; do not partially pause
            // the set if one of the workflow records cannot be read.
            const records = [];
            for (const view of selected) {
              const workflow = await github.rest.actions.getWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: QUIESCE[view],
              });
              records.push({ view, id: workflow.data.id, state: workflow.data.state });
            }

            // Preserve the original enabled/disabled state. Only restore a
            // workflow that this run found active and then disabled itself.
            const restoreIds = records
              .filter(item => item.state === 'active')
              .map(item => item.id);
            core.setOutput('restore_ids', JSON.stringify(restoreIds));

            for (const item of records.filter(item => item.state === 'active')) {
              await github.rest.actions.disableWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: item.id,
              });
              core.info(`Temporarily disabled ${item.view} publisher workflow.`);
            }

            // Re-check after disabling to catch a scheduled/manual run that
            // raced with the pause. Never delete while a selected run is live.
            const activeStates = new Set(['queued', 'in_progress', 'requested', 'waiting', 'pending']);
            const conflicts = [];
            for (const item of records) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: item.id,
                per_page: 100,
              });
              for (const run of runs) {
                if (activeStates.has(run.status)) {
                  conflicts.push(`${item.view}: run ${run.id} (${run.status})`);
                }
              }
            }
            if (conflicts.length) {
              throw new Error(
                'Reset stopped safely. A selected collector/publisher run is still active: ' +
                conflicts.join('; ') + '. No data has been cleared. Re-run after it finishes.'
              );
            }
            core.info('Selected publisher workflows are paused and no active runs remain.');

      # Restore the most recent matching view cache so its full current working
      # database and media can be backed up before every matching cache is deleted.
      - name: Restore latest Nature database/media cache
        if: inputs.target == 'nature' || inputs.target == 'both'
        uses: actions/cache/restore@v4
        with:
          path: .publisher-data/nature/
          key: global-database-cleaner-nature-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nature-db-v1-Linux-

      - name: Restore latest Alien World database/media cache
        if: inputs.target == 'alien-world' || inputs.target == 'both'
        uses: actions/cache/restore@v4
        with:
          path: .publisher-data/alien-world/
          key: global-database-cleaner-alien-world-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alien-world-db-v1-Linux-

      - name: Create selected-view backup before deletion
        env:
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/global_database_cleaner.py backup \
            --target "$TARGET" \
            --archive "$RUNNER_TEMP/LIVE_EARTH_${TARGET}_RESET_BACKUP.zip"

      - name: Save short-lived recovery backup
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-EARTH-${{ inputs.target }}-RESET-BACKUP-${{ github.run_id }}
          path: ${{ runner.temp }}/LIVE_EARTH_${{ inputs.target }}_RESET_BACKUP.zip
          retention-days: 3
          compression-level: 1
          if-no-files-found: error

      - name: Clear only the selected view's three explicit paths
        id: clear
        env:
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          # Output is set before deletion so the final safety gate knows when
          # a destructive operation has begun.
          echo "cleanup_started=true" >> "$GITHUB_OUTPUT"
          python scripts/global_database_cleaner.py clear \
            --target "$TARGET" \
            --report "$RUNNER_TEMP/LIVE_EARTH_${TARGET}_RESET_REPORT.json"

      - name: Commit deletion of selected published feeds and assets
        env:
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          case "$TARGET" in
            nature)      git add -A -- nature/published/ ;;
            alien-world) git add -A -- alien-world/published/ ;;
            both)        git add -A -- nature/published/ alien-world/published/ ;;
            *) echo "Unsupported target" >&2; exit 2 ;;
          esac

          if git diff --cached --quiet; then
            echo "No tracked published files needed deletion."
          else
            git commit -m "Reset selected live feed publication data"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Delete only selected view Actions cache entries
        id: delete_caches
        uses: actions/github-script@v7
        with:
          script: |
            const target = context.payload.inputs.target;
            // =================================================================
            // FUTURE VIEW ADDITION: add the exact database-cache prefix here.
            // Never delete pip or other unrelated cache families.
            // =================================================================
            const PREFIXES = {
              nature: 'nature-db-v1-',
              'alien-world': 'alien-world-db-v1-',
            };
            const selected = target === 'both'
              ? ['nature', 'alien-world']
              : [target];
            const prefixes = selected.map(view => PREFIXES[view]);
            const matches = [];

            // Collect the complete matching list first, then delete by ID.
            // This avoids page-offset shifts while cache records are removed.
            for (let page = 1; page <= 100; page++) {
              const response = await github.request(
                'GET /repos/{owner}/{repo}/actions/caches',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'refs/heads/main',
                  per_page: 100,
                  page,
                }
              );
              const entries = response.data.actions_caches || [];
              for (const cache of entries) {
                if (cache.ref === 'refs/heads/main' && prefixes.some(prefix => cache.key.startsWith(prefix))) {
                  matches.push(cache);
                }
              }
              if (entries.length < 100) break;
            }

            for (const cache of matches) {
              await github.request(
                'DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                }
              );
              core.info(`Deleted selected cache: ${cache.key} (${cache.id})`);
            }
            core.info(`Deleted ${matches.length} matching cache entr${matches.length === 1 ? 'y' : 'ies'}.`);
            core.setOutput('cache_cleanup_complete', 'true');

      - name: Request GitHub Pages rebuild after published-output deletion
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request(
              'POST /repos/{owner}/{repo}/pages/builds',
              { owner: context.repo.owner, repo: context.repo.repo }
            );
            core.info(`GitHub Pages rebuild requested (HTTP ${response.status}).`);

      - name: Re-enable only workflows paused by this cleaner
        if: >-
          always() &&
          steps.quiesce.outputs.restore_ids != '' &&
          (steps.clear.outputs.cleanup_started != 'true' || steps.delete_caches.outputs.cache_cleanup_complete == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const raw = `${{ steps.quiesce.outputs.restore_ids }}`;
            const ids = raw ? JSON.parse(raw) : [];
            for (const workflow_id of ids) {
              await github.rest.actions.enableWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
              });
              core.info(`Re-enabled workflow ${workflow_id}.`);
            }
