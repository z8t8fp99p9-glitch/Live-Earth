name: LIVE // EARTH ZIP Extractor

on:
  push:
    branches: [main]
    paths:
      - "LIVE_EARTH_MAIN_UPLOAD.zip"

permissions:
  contents: write

concurrency:
  group: live-earth-zip-extractor
  cancel-in-progress: false

jobs:
  import-main-upload:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and apply the one-file ZIP upload
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import stat
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd().resolve()
          archive = repo / "LIVE_EARTH_MAIN_UPLOAD.zip"

          if not archive.is_file():
              raise SystemExit("Upload ZIP not found at repository root.")
          if archive.stat().st_size > 100 * 1024 * 1024:
              raise SystemExit("Upload ZIP exceeds the 100 MiB safety limit.")

          def safe_path(value):
              if not isinstance(value, str) or not value or "\\" in value or "\x00" in value:
                  raise ValueError(f"Invalid path in manifest: {value!r}")
              path = PurePosixPath(value)
              if path.is_absolute() or any(part in ("", ".", "..") for part in path.parts):
                  raise ValueError(f"Unsafe path in manifest: {value!r}")
              if path.parts[0] in (".git", ".github"):
                  raise ValueError("Uploads may not change Git metadata or GitHub workflow/configuration files.")
              if ":" in path.parts[0]:
                  raise ValueError(f"Drive-qualified path is not allowed: {value!r}")
              if path.as_posix() in ("UPLOAD_MANIFEST.json", "LIVE_EARTH_MAIN_UPLOAD.zip"):
                  raise ValueError(f"Reserved upload path is not allowed: {value!r}")
              return path

          with zipfile.ZipFile(archive) as zf:
              infos = [info for info in zf.infolist() if not info.is_dir()]
              if len(infos) > 5000:
                  raise SystemExit("Upload contains more than 5,000 files.")

              names = [info.filename for info in infos]
              if len(names) != len(set(names)):
                  raise SystemExit("Upload contains duplicate ZIP paths.")
              if "UPLOAD_MANIFEST.json" not in names:
                  raise SystemExit("UPLOAD_MANIFEST.json is missing.")

              manifest_raw = zf.read("UPLOAD_MANIFEST.json")
              if len(manifest_raw) > 2 * 1024 * 1024:
                  raise SystemExit("Upload manifest is unexpectedly large.")
              manifest = json.loads(manifest_raw)
              if manifest.get("schemaVersion") != 1 or not isinstance(manifest.get("files"), list):
                  raise SystemExit("Unsupported or invalid upload manifest.")

              expected = {}
              for item in manifest["files"]:
                  rel = safe_path(item.get("path"))
                  name = rel.as_posix()
                  if name in expected:
                      raise SystemExit(f"Duplicate manifest path: {name}")
                  expected[name] = item

              archive_payload = set(names) - {"UPLOAD_MANIFEST.json"}
              if archive_payload != set(expected):
                  raise SystemExit("ZIP contents do not exactly match the manifest file list.")

              deletions = manifest.get("delete", [])
              if not isinstance(deletions, list):
                  raise SystemExit("Manifest delete field must be a list.")
              delete_paths = [safe_path(path).as_posix() for path in deletions]
              if len(delete_paths) != len(set(delete_paths)):
                  raise SystemExit("Manifest contains duplicate deletion paths.")
              if set(delete_paths) & set(expected):
                  raise SystemExit("Manifest has conflicting write and deletion paths.")

              total_uncompressed = 0
              for info in infos:
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic links are not allowed: {info.filename}")
                  if info.file_size > 50 * 1024 * 1024:
                      raise SystemExit(f"File exceeds 50 MiB: {info.filename}")
                  total_uncompressed += info.file_size
              if total_uncompressed > 250 * 1024 * 1024:
                  raise SystemExit("Uncompressed upload exceeds 250 MiB.")

              with tempfile.TemporaryDirectory(prefix="live-earth-import-") as temp_dir:
                  stage = Path(temp_dir)

                  # Validate every payload file before changing the checkout.
                  for name, item in expected.items():
                      data = zf.read(name)
                      if len(data) != item.get("size"):
                          raise SystemExit(f"Size mismatch: {name}")
                      digest = hashlib.sha256(data).hexdigest()
                      if digest != item.get("sha256"):
                          raise SystemExit(f"SHA-256 mismatch: {name}")
                      target = stage / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)

                  # Apply only after the entire archive and manifest have passed validation.
                  for name in sorted(expected):
                      rel = safe_path(name)
                      target = repo.joinpath(*rel.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      for ancestor in (target, *target.parents):
                          if ancestor == repo.parent:
                              break
                          if ancestor.is_symlink():
                              raise SystemExit(f"Refusing to write through a symbolic link: {name}")
                      if repo not in target.resolve().parents:
                          raise SystemExit(f"Destination escapes repository: {name}")
                      shutil.copy2(stage / name, target)
                      print(f"Applied: {name}")

                  for name in delete_paths:
                      rel = safe_path(name)
                      target = repo.joinpath(*rel.parts)
                      if target.is_symlink():
                          raise SystemExit(f"Refusing to delete a symbolic link: {name}")
                      if target.exists() and target.is_file():
                          target.unlink()
                          print(f"Deleted: {name}")
                      elif target.exists():
                          raise SystemExit(f"Refusing to delete a directory: {name}")

          # Remove the uploaded archive only after successful validation and application.
          archive.unlink()
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)

          changed = subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode != 0
          if changed:
              subprocess.run(["git", "commit", "-m", "Apply LIVE // EARTH Main Upload"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
              print("Main upload applied and committed to main.")
          else:
              print("No repository changes were present in the upload.")
          PY
