
name: LIVE // EARTH Universal Data Refresh

on:
  schedule:
    # Run automatically every hour at minute 23 UTC.
    - cron: "55 * * * *"

  # Allow manual runs from GitHub Actions.
  workflow_dispatch:
    inputs:
      refresh_reason:
        description: "Reason for manual refresh"
        required: false
        default: "Manual data refresh"
        type: string

permissions:
  contents: write

concurrency:
  group: live-earth-universal-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Universal Dataset Collection
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Report workflow trigger
        run: |
          echo "Workflow: LIVE // EARTH Universal Data Refresh"
          echo "Trigger: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "UTC time: $(date -u)"

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Universal Collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Data/Universal/requirements.txt

      - name: Activate configured datasets
        run: |
          python -m Data.Universal.engine.bootstrap

      - name: Run Universal Collector
        id: collect
        continue-on-error: true
        run: |
          python -m Data.Universal.engine.collector

      - name: Commit central database and registry
        if: always() && steps.checkout.outcome == 'success' && steps.collect.outcome == 'success'
        run: |
          git add Data/Universal Data/Central-Database

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Refresh Universal dataset storage"
            git push origin HEAD:main
          else
            echo "No central dataset changes to commit."
          fi

      - name: Report collection failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::One or more Universal dataset jobs failed."
          exit 1
