
name: Alien World Live Feed Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '45 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: alien-world-live-feed-pipeline
  cancel-in-progress: false

jobs:
  publish-live-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: editorial-engine/requirements.txt

      - name: Restore the Alien World's isolated Newsroom database and private media cache
        uses: actions/cache@v4
        with:
          path: .publisher-data/alien-world/
          key: alien-world-db-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alien-world-db-v1-${{ runner.os }}-

      - name: Install shared Global Newsroom dependencies
        run: python -m pip install --disable-pip-version-check -r editorial-engine/requirements.txt

      - name: Global Newsroom — Manager, Global Collector, Checker, Image Engine, Editorial and Database Writer
        run: python editorial-engine/newsroom_orchestrator.py --view alien-world --repository-root .

      - name: Alien World Publisher — publish validated Live Feed and Newsroom images
        shell: bash
        run: |
          set -euo pipefail
          python alien-world/publisher/newsroom_publisher.py \
            | tee "$RUNNER_TEMP/alien-world-live-publisher-result.json"

      - name: Commit the completed Live Feed and approved assets
        id: publish_commit
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s alien-world/published/live-feed.json ]]; then
            echo "Publisher produced no valid live-feed.json output." >&2
            exit 3
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- alien-world/published/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No live-feed changes; the last-good feed remains in place."
          else
            git commit -m "Publish Alien World live feed"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages rebuild for a changed Live Feed
        if: steps.publish_commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request(
              'POST /repos/{owner}/{repo}/pages/builds',
              { owner: context.repo.owner, repo: context.repo.repo }
            );
            core.info(`GitHub Pages rebuild requested (HTTP ${response.status}).`);

      - name: Upload Alien World Final Checker PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alien-world-final-checker-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .checker-archive/alien-world/*.pdf
          if-no-files-found: warn
          retention-days: 32
