name: Alien World Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose which publication to produce
        type: choice
        required: true
        default: magazine
        options:
          - live
          - magazine
          - all
      custom_request:
        description: Optional custom editorial request for the Universal Editorial Engine
        type: string
        required: false
        default: ""
  schedule:
    - cron: '0 */3 * * *'
    - cron: '30 3 * * 0'

permissions:
  contents: write
  pages: write

concurrency:
  group: alien-world-publication-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: editorial-engine/requirements.txt

      - name: Restore the Alien World source database
        uses: actions/cache@v4
        with:
          path: .publisher-data/alien-world/
          key: alien-world-db-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alien-world-db-v1-${{ runner.os }}-

      - name: Install Data Collector and Engine dependencies
        run: python -m pip install --disable-pip-version-check -r editorial-engine/requirements.txt

      - name: Select publication mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${INPUT_MODE:-magazine}"
          elif [[ "$EVENT_SCHEDULE" == "30 3 * * 0" ]]; then
            mode="magazine"
          else
            mode="live"
          fi
          case "$mode" in
            live|magazine|all) ;;
            *) echo "Unsupported publication mode: $mode" >&2; exit 2 ;;
          esac
          echo "PUBLISH_MODE=$mode" >> "$GITHUB_ENV"
          echo "Selected Alien World publication mode: $mode"

      - name: Collect external sources into the database
        shell: bash
        run: |
          set -euo pipefail
          python data-collection/alien-world/collector.py \
            | tee "$RUNNER_TEMP/alien-world-collection-result.json"

      - name: Command the Universal Editorial Engine and route its output
        shell: bash
        env:
          CUSTOM_REQUEST: ${{ inputs.custom_request }}
        run: |
          set -euo pipefail
          python publishers/alien-world/publisher.py \
            --mode "$PUBLISH_MODE" \
            --custom-request "$CUSTOM_REQUEST" \
            | tee "$RUNNER_TEMP/alien-world-publisher-result.json"

      - name: Commit only completed Alien World view outputs
        id: publish_commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d published/alien-world ]]; then
            echo "Publisher produced no public output directory." >&2
            exit 3
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- published/alien-world
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication files changed; the existing last-good outputs remain in place."
          else
            git commit -m "Publish Alien World editorial output"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages rebuild for newly published output
        if: steps.publish_commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request(
              'POST /repos/{owner}/{repo}/pages/builds',
              { owner: context.repo.owner, repo: context.repo.repo }
            );
            core.info(`GitHub Pages rebuild requested (HTTP ${response.status}).`)