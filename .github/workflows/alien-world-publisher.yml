name: Alien World Live Feed Publisher

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: alien-world-publication-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: editorial-engine/requirements.txt

      - name: Restore the Alien World source database
        uses: actions/cache@v4
        with:
          path: .publisher-data/alien-world/
          key: alien-world-db-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alien-world-db-v1-${{ runner.os }}-

      - name: Install Collector and Engine dependencies
        run: python -m pip install --disable-pip-version-check -r editorial-engine/requirements.txt

      - name: Collect NASA source material
        shell: bash
        run: |
          set -euo pipefail
          python alien-world/collector/collector.py \
            | tee "$RUNNER_TEMP/alien-world-collection-result.json"

      - name: Publish Live Feed only
        shell: bash
        run: |
          set -euo pipefail
          python alien-world/publisher/publisher.py \
            --mode live \
            | tee "$RUNNER_TEMP/alien-world-publisher-result.json"

      - name: Validate the published Live Feed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("alien-world/published/live-feed.json")

          if not path.is_file():
              raise SystemExit("Live Feed output is missing.")

          feed = json.loads(path.read_text(encoding="utf-8"))

          if feed.get("schemaVersion") != 1:
              raise SystemExit("Invalid Live Feed schema.")

          if feed.get("viewId") != "alien-world":
              raise SystemExit("Incorrect view identity.")

          if feed.get("publisherId") != "alien-world-publisher":
              raise SystemExit("Incorrect Publisher identity.")

          if not feed.get("generatedAt"):
              raise SystemExit("Live Feed generation timestamp is missing.")

          if not isinstance(feed.get("stories"), list):
              raise SystemExit("Live Feed stories must be a list.")

          if feed.get("storyCount") != len(feed["stories"]):
              raise SystemExit("Live Feed story count does not match its contents.")

          print(
              f"Live Feed validated successfully: "
              f"{feed['storyCount']} stories."
          )
          PY

      - name: Commit only the Live Feed
        id: publish_commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- alien-world/published/live-feed.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Live Feed changes to publish."
          else
            git commit -m "Publish Alien World live feed"

            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main

            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages rebuild
        if: steps.publish_commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request(
              'POST /repos/{owner}/{repo}/pages/builds',
              {
                owner: context.repo.owner,
                repo: context.repo.repo
              }
            );

            core.info(
              `GitHub Pages rebuild requested (HTTP ${response.status}).`
            );