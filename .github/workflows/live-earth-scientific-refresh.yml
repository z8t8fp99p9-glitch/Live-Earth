
name: LIVE // EARTH Scientific Data Refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-earth-scientific-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect and publish scientific snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scientific data tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Data/Scientific/requirements-refresh.txt

      - name: Collect and validate all six worlds
        id: collect
        continue-on-error: true
        run: |
          python Data/Scientific/refresh_all.py

      - name: Commit successful world snapshots
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add atmosphere oceans land water_ice earth_activity energy_humanity

            if ! git diff --cached --quiet; then
              git commit -m "Refresh latest scientific data snapshots"
              git push origin HEAD:main
            else
              echo "No verified dataset changes to commit."
            fi
          else
            echo "No verified dataset changes."
          fi

      - name: Report collection failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::One or more scientific world collectors failed. Successful world snapshots were still given an opportunity to publish."
          exit 1
