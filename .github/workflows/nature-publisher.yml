name: Nature Live Feed Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: nature-live-feed-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: editorial-engine/requirements.txt

      - name: Restore Nature's existing Collector database and media cache
        uses: actions/cache@v4
        with:
          path: .publisher-data/nature/
          key: nature-db-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nature-db-v1-${{ runner.os }}-

      - name: Install shared Editorial Engine dependencies
        run: python -m pip install --disable-pip-version-check -r editorial-engine/requirements.txt

      - name: Nature Collector — collect RSS and re-screen approved photographs
        run: python nature/collector/collector.py

      - name: Nature Publisher — publish Live Feed only
        run: python nature/publisher/publisher.py --mode live

      - name: Commit only the validated Nature Live Feed and current media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- nature/published/
          if git diff --cached --quiet; then
            echo "No Nature Live Feed changes; last-good output remains."
          else
            git commit -m "Publish Nature live feed"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi