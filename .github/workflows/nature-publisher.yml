
name: Nature Live Feed Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: nature-live-feed-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: editorial-engine/requirements.txt

      - name: Restore Nature's isolated Newsroom database and private media cache
        uses: actions/cache@v4
        with:
          path: .publisher-data/nature/
          key: nature-db-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nature-db-v1-${{ runner.os }}-

      - name: Install shared Global Newsroom dependencies
        run: python -m pip install --disable-pip-version-check -r editorial-engine/requirements.txt

      - name: Global Newsroom — Manager, Global Collector, Checker, Image Engine, Editorial and Database Writer
        run: python editorial-engine/newsroom_orchestrator.py --view nature --repository-root .

      - name: Nature Publisher — publish validated Live Feed and Newsroom images
        run: python nature/publisher/newsroom_publisher.py

      - name: Commit validated Nature Live Feed and approved assets
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s nature/published/live-feed.json ]]; then
            echo "Publisher produced no valid Nature live-feed.json." >&2
            exit 3
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- nature/published/

          if git diff --cached --quiet; then
            echo "No Nature Live Feed changes; last-good output remains."
          else
            git commit -m "Publish Nature live feed"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload Nature Final Checker PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nature-final-checker-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .checker-archive/nature/*.pdf
          if-no-files-found: warn
          retention-days: 32
