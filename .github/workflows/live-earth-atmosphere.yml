
name: LIVE // EARTH Atmosphere Refresh

on:
  workflow_dispatch:
    inputs:
      refresh_reason:
        description: "Reason for manual refresh"
        required: false
        default: "Manual Atmosphere refresh"
        type: string

permissions:
  contents: write

concurrency:
  group: live-earth-universal-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Atmosphere Dataset Collection
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Report workflow trigger
        run: |
          echo "Workflow: LIVE // EARTH Atmosphere Refresh"
          echo "Trigger: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "UTC time: $(date -u)"

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Universal Collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Data/Universal/requirements.txt

      - name: Configure Atmosphere datasets
        id: bootstrap
        run: |
          python -m Data.Universal.engine.group_bootstrap --group atmosphere

      - name: Run Atmosphere collector
        id: collect
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        run: |
          python -m Data.Universal.engine.collector --group atmosphere

      - name: Commit successful datasets and registry
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git add Data/Universal Data/Central-Database

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Refresh Atmosphere dataset storage"
            git push origin HEAD:main
          else
            echo "No Atmosphere dataset changes to commit."
          fi

      - name: Report collection failures
        if: steps.bootstrap.outcome == 'failure' || steps.collect.outcome == 'failure'
        run: |
          echo "::error::Atmosphere collection failed."
          exit 1
