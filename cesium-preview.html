<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/Widgets/widgets.css">
<style>
:root{color-scheme:dark;background:#02050b;color:#eaf5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;background:#02050b;overscroll-behavior:none;touch-action:none}
#space{position:absolute;inset:0;pointer-events:none;background:radial-gradient(1px 1px at 12% 17%,#d9edffb0 45%,transparent),radial-gradient(1px 1px at 79% 20%,#c9e4ff9c 45%,transparent),radial-gradient(1px 1px at 24% 73%,#d9edff8c 45%,transparent),radial-gradient(1px 1px at 87% 68%,#d9edff9c 45%,transparent),radial-gradient(1px 1px at 62% 85%,#c9e4ff8c 45%,transparent),radial-gradient(1px 1px at 42% 11%,#fff8 45%,transparent)}
#globe{position:absolute;inset:0;width:100%;height:100%}.cesium-viewer,.cesium-viewer-cesiumWidgetContainer,.cesium-widget,.cesium-widget canvas{position:absolute!important;inset:0;width:100%!important;height:100%!important}.cesium-viewer-bottom,.cesium-viewer-toolbar,.cesium-viewer-fullscreenContainer{display:none!important}.cesium-widget-credits{display:block!important;left:8px!important;right:auto!important;bottom:5px!important;opacity:.65!important;font-size:8px!important;max-width:65vw}
.brand{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 17px);left:19px;pointer-events:none;font-size:clamp(13px,2.8vw,17px);font-weight:800;letter-spacing:.19em;text-shadow:0 1px 8px #000}.brand span{color:#65d9ff}
#orbit{position:absolute;z-index:1;left:50%;top:53%;width:98vw;height:43vw;max-height:56vh;transform:translate(-50%,-50%) rotate(-7deg);border:1px solid #9bcfff1d;border-radius:50%;pointer-events:none}
#navButtons{position:absolute;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom) + 49px);transform:translateX(-50%);width:min(94vw,520px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:clamp(2px,1.2vw,9px)}
.orbButton{appearance:none;min-width:0;padding:0 0 2px;border:0;background:transparent;color:#dbeaf7;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 clamp(8px,2.4vw,11px)/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;touch-action:manipulation}
.orbShell{position:relative;display:block;width:clamp(49px,14.2vw,76px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:1px solid #dcf5ff8f;background:linear-gradient(145deg,#ffffff29,#5e95be0b 42%,#00050f6b);box-shadow:inset 1px 1px 2px #ffffff6b,inset -2px -3px 5px #0009,0 4px 8px #0009}
.orbImage{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%;clip-path:circle(48.8% at 50% 50%);user-select:none;-webkit-user-drag:none}.orbShell:before{content:"";position:absolute;inset:1.5%;z-index:2;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at 28% 13%,#ffffffa3,transparent 22%),linear-gradient(138deg,#ffffff3d,#ffffff09 25%,transparent 44%,#ffffff05 68%,#ffffff33);box-shadow:inset 1px 1px 2px #ffffffbd,inset -2px -3px 5px #0008}.orbLabel{white-space:nowrap;text-shadow:0 1px 7px #000;opacity:.9}
#message{position:absolute;z-index:10;left:50%;top:calc(env(safe-area-inset-top) + 55px);transform:translateX(-50%);max-width:88vw;padding:8px 12px;border:1px solid #9bdcff30;border-radius:12px;background:#06101edb;color:#bfd8e8;font-size:11px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}#message.show{opacity:1}
#quality[hidden]{display:none!important}
@media(min-width:600px){#navButtons{bottom:38px;gap:10px}.orbShell{width:clamp(68px,8vw,88px)}.orbButton{font-size:11px}}@media(max-height:700px){#navButtons{bottom:calc(env(safe-area-inset-bottom) + 42px)}.orbShell{width:clamp(43px,11vw,63px)}}
</style>
<script>window.CESIUM_BASE_URL="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/";</script>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/Cesium.js"></script>
</head><body>
<div id="space" aria-hidden="true"></div><div id="orbit" aria-hidden="true"></div>
<div id="globe" aria-label="Interactive Earth globe"></div><div class="brand">LIVE <span>//</span> EARTH</div><div id="message" role="status" aria-live="polite"></div>
<nav id="navButtons" aria-label="LIVE Earth orb controls">
<button class="orbButton" data-view="earth" aria-label="Earth"><span class="orbShell"><img class="orbImage" src="./earth.webp" alt=""></span><span class="orbLabel">Earth</span></button>
<button class="orbButton" data-view="moon" aria-label="Moon"><span class="orbShell"><img class="orbImage" src="./moon.webp" alt=""></span><span class="orbLabel">Moon</span></button>
<button class="orbButton" data-view="sun" aria-label="Sun"><span class="orbShell"><img class="orbImage" src="./sun.webp" alt=""></span><span class="orbLabel">Sun</span></button>
<button class="orbButton" data-view="location" aria-label="Location"><span class="orbShell"><img class="orbImage" src="./location.webp" alt=""></span><span class="orbLabel">Location</span></button>
<button class="orbButton" data-view="stacks" aria-label="Stacks"><span class="orbShell"><img class="orbImage" src="./stacks.webp" alt=""></span><span class="orbLabel">Stacks</span></button>
</nav>
<div id="quality" hidden style="position:absolute;z-index:12;left:50%;bottom:calc(env(safe-area-inset-bottom) + 139px);transform:translateX(-50%);display:flex;gap:8px;padding:6px;border:1px solid #b6e6ff40;border-radius:999px;background:#071321dd;backdrop-filter:blur(16px)"><button data-quality="basic">BASIC</button><button data-quality="hd">HD</button></div>
<style>#quality button{min-width:78px;padding:10px 13px;border:1px solid #b6e6ff40;border-radius:999px;background:#ffffff0d;color:#eaf5ff}</style>
<script>
(()=>{'use strict';
const C=window.Cesium,msg=document.querySelector('#message'),qualityBox=document.querySelector('#quality');
let viewer,unlocked=false,quality='basic',timer;
function tell(s){msg.textContent=s;msg.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>msg.classList.remove('show'),3800)}
if(!C){tell('Cesium failed to load. Check connection and reload.');return}
function frameEarth(){
  // A virtual square camera frame: use the shorter ACTUAL Cesium canvas side in either orientation.
  const canvas=viewer.canvas;
  const width=Math.max(1,canvas.clientWidth||canvas.width||1);
  const height=Math.max(1,canvas.clientHeight||canvas.height||1);
  const side=Math.min(width,height);
  const frustum=viewer.camera.frustum;
  const verticalFov=(frustum.fovy||C.Math.toRadians(60));
  const aspect=width/height;
  // The square's short side is horizontal in portrait and vertical in landscape.
  const squareFov=width<=height
    ? 2*Math.atan(Math.tan(verticalFov/2)*aspect)
    : verticalFov;
  const targetFraction=0.75;
  const tangentHalfAngle=Math.atan(targetFraction*Math.tan(squareFov/2));
  const radius=C.Ellipsoid.WGS84.maximumRadius;
  const cameraDistance=radius/Math.sin(tangentHalfAngle);
  return C.Cartesian3.fromDegrees(0,10,cameraDistance-radius);
}
function home(duration=0){
  viewer.camera.cancelFlight();
  if(duration>0){
    viewer.camera.flyTo({destination:frameEarth(),orientation:{heading:0,pitch:-Math.PI/2,roll:0},duration,complete:()=>viewer.scene.requestRender()});
  }else{
    viewer.camera.setView({destination:frameEarth(),orientation:{heading:0,pitch:-Math.PI/2,roll:0}});
    viewer.scene.requestRender();
  }
}
(async()=>{try{
let imagery;
try{imagery=new C.ImageryLayer(await C.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'))}
catch(e){imagery=new C.ImageryLayer(new C.UrlTemplateImageryProvider({url:'https://tile.openstreetmap.org/{z}/{y}/{x}.png',credit:'© OpenStreetMap contributors'}))}
viewer=new C.Viewer('globe',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,selectionIndicator:false,shouldAnimate:true,requestRenderMode:false,baseLayer:imagery,terrainProvider:new C.EllipsoidTerrainProvider()});
viewer.scene.backgroundColor=C.Color.fromCssColorString('#02050b');
viewer.scene.globe.enableLighting=true;viewer.scene.globe.dynamicAtmosphereLighting=true;viewer.scene.globe.dynamicAtmosphereLightingFromSun=true;viewer.scene.globe.showGroundAtmosphere=true;viewer.scene.skyAtmosphere.show=true;viewer.scene.sun.show=true;viewer.scene.moon.show=false;
viewer.clock.currentTime=C.JulianDate.now();viewer.clock.shouldAnimate=true;viewer.clock.multiplier=1;
const controller=viewer.scene.screenSpaceCameraController;controller.enableRotate=true;controller.enableTranslate=false;controller.enableZoom=false;controller.enableTilt=false;controller.enableLook=false;
home(0);
// Retain the original timestamp-based Keplerian Moon orbit calculation.
function moonPositionAt(date=new Date()){
 const jd=date.getTime()/86400000+2440587.5,d=jd-2451545,rad=Math.PI/180,N=(125.1228-.0529538083*d)*rad,i=5.1454*rad,w=(318.0634+.1643573223*d)*rad,a=60.2666,e=.0549,M=((((115.3654+13.0649929509*d)%360)+360)%360)*rad;let E=M;
 for(let k=0;k<10;k++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
 const xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.hypot(xv,yv);
 return{x:r*(Math.cos(N)*Math.cos(v+w)-Math.sin(N)*Math.sin(v+w)*Math.cos(i)),y:r*(Math.sin(N)*Math.cos(v+w)+Math.cos(N)*Math.sin(v+w)*Math.cos(i)),z:r*Math.sin(v+w)*Math.sin(i)};
}
const scale=.04,R=C.Ellipsoid.WGS84.maximumRadius;
function moonWorldPosition(date){const p=moonPositionAt(date);return new C.Cartesian3(p.x*R*scale,p.z*R*scale,-p.y*R*scale)}
const orbit=[];for(let k=0;k<=360;k++)orbit.push(moonWorldPosition(new Date(Date.now()-15*86400000+k/360*30*86400000)));
viewer.entities.add({name:'Live Earth Moon Orbit',polyline:{positions:orbit,width:1.3,material:C.Color.fromCssColorString('#9bcfff').withAlpha(.22),arcType:C.ArcType.NONE}});
// A true 3D lunar sphere with a lightweight procedural crater texture.
function makeMoonTexture(){
 const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=512;
 const ctx=canvas.getContext('2d');
 const grad=ctx.createLinearGradient(0,0,0,512);grad.addColorStop(0,'#aaaeb6');grad.addColorStop(.5,'#c5c7cb');grad.addColorStop(1,'#969ba5');ctx.fillStyle=grad;ctx.fillRect(0,0,1024,512);
 let seed=991827;const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
 // Broad maria first, then subtle crater rims and shadowed floors across the texture.
 for(let n=0;n<42;n++){const x=rand()*1024,y=20+rand()*472,rx=18+rand()*74,ry=7+rand()*25;ctx.fillStyle=`rgba(53,59,70,${.045+rand()*.08})`;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rand()*Math.PI,0,Math.PI*2);ctx.fill();}
 for(let n=0;n<1500;n++){const x=rand()*1024,y=rand()*512,r=1+Math.pow(rand(),2)*10;ctx.strokeStyle=`rgba(244,246,250,${.08+rand()*.2})`;ctx.lineWidth=Math.max(.6,r*.14);ctx.beginPath();ctx.ellipse(x,y,r,r*(.65+rand()*.35),rand()*.4,0,Math.PI*2);ctx.stroke();ctx.fillStyle=`rgba(42,47,57,${.035+rand()*.11})`;ctx.beginPath();ctx.ellipse(x+r*.12,y+r*.14,r*.72,r*.63,0,0,Math.PI*2);ctx.fill();}
 return canvas;
}
const moonRadius=R*.32;
viewer.entities.add({name:'Live Moon · 3D sphere',position:new C.CallbackProperty(()=>moonWorldPosition(new Date()),false),ellipsoid:{radii:new C.Cartesian3(moonRadius,moonRadius,moonRadius),material:new C.ImageMaterialProperty({image:makeMoonTexture(),transparent:false}),maximumCone:Math.PI/2,stackPartitions:48,slicePartitions:64,shadows:C.ShadowMode.DISABLED}});
window.LiveEarthScene={
 unlock(){if(unlocked)return;unlocked=true;qualityBox.hidden=false;viewer.camera.flyTo({destination:C.Cartesian3.fromDegrees(78.5,22,10500000),orientation:{heading:0,pitch:-Math.PI/2,roll:0},duration:.65})},
 lock(){if(!unlocked)return;unlocked=false;qualityBox.hidden=true;home(.65)},
 setQuality(v){quality=v==='hd'?'hd':'basic';viewer.resolutionScale=quality==='hd'?Math.min(devicePixelRatio||1,1.5):Math.min(devicePixelRatio||1,1);qualityBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.quality===quality)));return quality}
};
qualityBox.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>window.LiveEarthScene.setQuality(b.dataset.quality)));
document.querySelectorAll('.orbButton').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.view;if(id==='earth'){unlocked?window.LiveEarthScene.lock():window.LiveEarthScene.unlock();return}if(unlocked)window.LiveEarthScene.lock();tell(({moon:'The Moon is following its timestamp-based orbital path.',sun:'Cesium solar lighting follows the scene time.',location:'Location is not wired into this preview.',stacks:'Stacks is not wired into this preview.'})[id]||'')}));
let resizeTimer=0,resizeFrame=0;
function resize(){
  // Coalesce iOS orientation/visualViewport events; resize Cesium before measuring its canvas.
  clearTimeout(resizeTimer);
  if(resizeFrame)cancelAnimationFrame(resizeFrame);
  resizeTimer=setTimeout(()=>{
    viewer.resize();
    resizeFrame=requestAnimationFrame(()=>{
      resizeFrame=0;
      if(!unlocked){
        // Cancel any stale camera flight so it cannot overwrite the latest orientation.
        viewer.camera.cancelFlight();
        viewer.camera.setView({
          destination:frameEarth(),
          orientation:{heading:0,pitch:-Math.PI/2,roll:0}
        });
      }
      viewer.scene.requestRender();
    });
  },120);
}
addEventListener('resize',resize,{passive:true});
if(window.visualViewport)visualViewport.addEventListener('resize',resize,{passive:true});
viewer.scene.globe.tileLoadProgressEvent.addEventListener(n=>{if(n===0)tell('Earth imagery loaded · Cesium sunlight active')});
}catch(e){console.error('[LIVE // EARTH preview]',e);tell('Cesium setup failed: '+(e?.message||String(e)))}})();
})();
</script></body></html>
