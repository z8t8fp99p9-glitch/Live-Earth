<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
<title id="title">LIVE // EARTH — Sun Sky View background</title>
<desc id="desc">Responsive, text-free golden cinematic vector landscape with atmospheric clouds, a radiant sky, layered mountains, and a dark foreground reserved for independent live interface elements.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101b38"/><stop offset=".26" stop-color="#61304b"/><stop offset=".53" stop-color="#ed6a36"/><stop offset=".72" stop-color="#ffb34f"/><stop offset="1" stop-color="#351c35"/>
  </linearGradient>
  <radialGradient id="sunGlow"><stop stop-color="#fff8bd" stop-opacity=".95"/><stop offset=".22" stop-color="#ffd568" stop-opacity=".62"/><stop offset="1" stop-color="#ff8a2b" stop-opacity="0"/></radialGradient>
  <linearGradient id="farMount" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b85d5b"/><stop offset="1" stop-color="#482b4a"/></linearGradient>
  <linearGradient id="midMount" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6b3a4b"/><stop offset="1" stop-color="#241d35"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17243a"/><stop offset="1" stop-color="#030914"/></linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb34d" stop-opacity=".7"/><stop offset="1" stop-color="#ff7d2e" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="cloudBlur"><feGaussianBlur stdDeviation="12"/></filter>
  <style>
    .portrait-only{display:inline}
    .landscape-only{display:none}
    @media (orientation: landscape) {
      .portrait-only{display:none}
      .landscape-only{display:inline}
    }
  </style>
</defs>
