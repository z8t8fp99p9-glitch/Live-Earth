  <path d="M0 1170 L95 1070 175 1130 275 1035 360 1150 460 1065 560 1160 660 1035 760 1135 850 1060 1000 1150 1000 1600 0 1600Z" fill="url(#front)"/>
  <path d="M420 1135 Q500 1105 560 1140 Q520 1210 600 1280 Q520 1370 590 1600 L390 1600 Q460 1390 400 1300 Q460 1220 420 1135Z" fill="url(#river)" opacity=".72"/>
  <g fill="#08111e">
