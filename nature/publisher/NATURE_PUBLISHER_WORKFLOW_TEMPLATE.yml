name: Nature Monthly Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Nature operation
        type: choice
        required: true
        default: all
        options:
          - collect
          - publish
          - all
  schedule:
    - cron: '15 2 * * *'
    - cron: '45 2 1 * *'

permissions:
  contents: write

concurrency:
  group: nature-monthly-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: editorial-engine/requirements.txt

      - name: Restore Nature's independent database and prepared media
        uses: actions/cache@v4
        with:
          path: .publisher-data/nature/
          key: nature-db-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nature-db-v1-${{ runner.os }}-

      - name: Install shared Engine dependencies
        run: python -m pip install --disable-pip-version-check -r editorial-engine/requirements.txt

      - name: Select mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${INPUT_MODE:-all}"
          elif [[ "$EVENT_SCHEDULE" == "45 2 1 * *" ]]; then
            mode="all"
          else
            mode="collect"
          fi
          echo "NATURE_MODE=$mode" >> "$GITHUB_ENV"

      - name: Nature Collector — only network and database writer
        if: env.NATURE_MODE == 'collect' || env.NATURE_MODE == 'all'
        run: python nature/collector/collector.py

      - name: Nature Publisher — read-only and no source network
        if: env.NATURE_MODE == 'publish' || env.NATURE_MODE == 'all'
        run: python nature/publisher/publisher.py --mode all

      - name: Commit only validated Nature publications
        if: env.NATURE_MODE == 'publish' || env.NATURE_MODE == 'all'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nature/published
          if git diff --cached --quiet; then
            echo "No Nature publication changed; last-good files remain."
          else
            git commit -m "Publish The Living World monthly edition"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
