<script>
(()=>{
 const buttons=[...document.querySelectorAll(".orbButton")];
 const status=document.querySelector("#status");
 let selected="earth", initializing=true;
 try{selected=localStorage.getItem("liveEarthSelectedButton")||"earth"}catch(e){}
 const supported=new Set(["earth","moon","sun","location","stacks"]);
 if(!supported.has(selected))selected="earth";
 const labels={earth:"Earth",moon:"Moon",sun:"Sun",location:"Location",stacks:"Stacks"};
 function activate(id){
  selected=id;
  buttons.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.view===id)));
  try{localStorage.setItem("liveEarthSelectedButton",id)}catch(e){}
  if(id==="earth"){status.hidden=true;document.querySelector("#astroPanel").hidden=true;return}
  if((id==="sun"||id==="moon")&&!initializing){status.hidden=true;window.dispatchEvent(new CustomEvent("live-earth-astro-preview",{detail:{view:id}}));return}
  if(id==="sun"||id==="moon"){status.hidden=true;return}
  document.querySelector("#astroPanel").hidden=true;status.hidden=false;
  status.textContent= id==="location" ? "Location tools are not connected yet. Your globe remains available." : `${labels[id]} view is not connected yet. Your Earth globe remains available.`;
  window.setTimeout(()=>{if(selected===id)status.hidden=true},2600);
 }
 buttons.forEach(button=>button.addEventListener("click",()=>activate(button.dataset.view)));
 activate(selected);
 initializing=false;
})();
</script>
<script type="module">
import {calculateAstronomy,dayKey} from './astronomy.js';
import {getRecord,saveAstronomy} from './data-store.js';
const panel=document.querySelector('#astroPanel'),title=document.querySelector('#astroTitle'),dateLabel=document.querySelector('#astroDate'),content=document.querySelector('#astroContent'),close=document.querySelector('#astroClose'),refresh=document.querySelector('#astroRefresh');
let activeView='moon',requestSerial=0;
const fmtTime=iso=>{if(!iso)return 'Not visible today';return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(iso))};
const fmtDuration=m=>`${Math.floor(m/60)}h ${m%60}m`;
function render(data,view){const d=data[view];const cells=view==='sun'?[['Sunrise',fmtTime(d.sunrise)],['Sunset',fmtTime(d.sunset)],['Solar noon',fmtTime(d.solarNoon)],['Daylight',d.polar==='polar night'?'Polar night':d.polar==='midnight sun'?'Midnight sun':fmtDuration(d.daylightMinutes)],['Altitude',`${d.altitudeDegrees}°`],['Direction',`${d.azimuthDegrees}°`]]:[['Moon phase',d.phase],['Illumination',`${d.illuminationPercent}%`],['Moonrise',fmtTime(d.moonrise)],['Moonset',fmtTime(d.moonset)],['Altitude',`${d.altitudeDegrees}°`],['Direction',`${d.azimuthDegrees}°`]];const hero=view==='sun'?(d.altitudeDegrees>0?'Above the horizon':'Below the horizon'):`${d.phase} · ${d.illuminationPercent}% lit`;content.innerHTML=`<div class="astroHero"><strong>${hero}</strong><span>${view==='sun'?'Current solar position':'Current lunar position'} · local device time</span></div><div class="astroGrid">${cells.map(([k,v])=>`<div class="astroMetric"><span>${k}</span><strong>${v}</strong></div>`).join('')}</div>`}
function message(text){content.innerHTML=`<div class="astroHero"><strong>Preview unavailable</strong><span>${text}</span></div><button class="astroAction" id="astroRetry">Try location again</button>`;document.querySelector('#astroRetry')?.addEventListener('click',()=>openPreview(activeView,true))}
async function openPreview(view,force=false){activeView=view;const serial=++requestSerial;title.textContent=view==='sun'?'Sun preview':'Moon preview';panel.hidden=false;dateLabel.textContent='Finding your location…';content.innerHTML='<div class="astroHero"><strong>Calculating locally…</strong><span>Location is requested only for this preview.</span></div>';if(!navigator.geolocation){dateLabel.textContent='Location unavailable';message('This browser does not provide location services.');return}navigator.geolocation.getCurrentPosition(async pos=>{if(serial!==requestSerial)return;try{const lat=pos.coords.latitude,lon=pos.coords.longitude,now=new Date(),today=dayKey(now),key=`preview:${today}:${lat.toFixed(3)},${lon.toFixed(3)}`;let record=force?null:await getRecord('astronomy_cache',key),data=record?.data;if(!data||data.date!==today){data=calculateAstronomy(lat,lon,now);await saveAstronomy(key,data,Date.now())}if(serial!==requestSerial)return;dateLabel.textContent=`${new Intl.DateTimeFormat(undefined,{dateStyle:'full'}).format(now)} · Saved on this device`;render(data,view)}catch(e){console.error(e);dateLabel.textContent='Calculation error';message('Could not calculate or save locally. Please try again.')}},err=>{if(serial!==requestSerial)return;dateLabel.textContent='Location permission needed';message(err.code===1?'Allow location access to calculate local Sun and Moon times.':err.code===2?'Your location could not be determined. Check Location Services and try again.':'Location lookup timed out. Try again.')},{enableHighAccuracy:false,timeout:12000,maximumAge:300000})}
window.addEventListener('live-earth-astro-preview',e=>openPreview(e.detail.view));close.addEventListener('click',()=>{requestSerial++;panel.hidden=true});refresh.addEventListener('click',()=>openPreview(activeView,true));
