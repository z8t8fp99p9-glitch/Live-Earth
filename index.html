let moonSystem={update:()=>null};try{const moonModule=await import('./moon-orbit.js');moonSystem=moonModule.createMoonOrbit(T,group,{earthRadius:1,samples:721,displayDistanceFactor:0.04,displayMoonRadius:0.32});}catch(moonError){console.warn('[LIVE // EARTH] Moon layer unavailable; preserving Earth scene.',moonError);}const pos=[];let seed=721;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<500;i++){const r=18+rand()*25,a=rand()*Math.PI*2,z=rand()*2-1,s=Math.sqrt(1-z*z);pos.push(r*s*Math.cos(a),r*z,r*s*Math.sin(a))}const sg=new T.BufferGeometry();sg.setAttribute('position',new T.Float32BufferAttribute(pos,3));scene.add(new T.Points(sg,new T.PointsMaterial({color:0xa9c9ec,size:.045,transparent:true,opacity:.72})));status.hidden=true;let frame=0;const draw=()=>{if(frame)return;frame=requestAnimationFrame(()=>{frame=0;renderer.render(scene,camera)})};draw();let moonTick=Date.now();const moonClock=setInterval(()=>{if(document.hidden)return;const now=Date.now();if(now-moonTick>=30000){moonTick=now;moonSystem.update(new Date(now));draw()}},10000);let active=null,x=0,y=0,drag=false;canvas.addEventListener('pointerdown',e=>{if(active!==null||e.pointerType==='touch'&&!e.isPrimary)return;active=e.pointerId;x=e.clientX;y=e.clientY;drag=true;canvas.setPointerCapture?.(e.pointerId);e.preventDefault()},{passive:false});canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==active)return;group.rotation.y+=(e.clientX-x)*.009;group.rotation.x=Math.max(-1.15,Math.min(1.15,group.rotation.x+(e.clientY-y)*.0055));x=e.clientX;y=e.clientY;draw()},{passive:false});const end=e=>{if(e.pointerId===active){drag=false;active=null}};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);addEventListener('resize',()=>{renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight,false);fitCamera();draw()},{passive:true});if(window <script>
(()=>{
 const buttons=[...document.querySelectorAll(".orbButton")];
 const status=document.querySelector("#status");
 let selected="earth", initializing=true;
 try{selected=localStorage.getItem("liveEarthSelectedButton")||"earth"}catch(e){}
 const supported=new Set(["earth","moon","sun","location","stacks"]);
 if(!supported.has(selected))selected="earth";
 const labels={earth:"Earth",moon:"Moon",sun:"Sun",location:"Location",stacks:"Stacks"};
 function activate(id){
  selected=id;
  buttons.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.view===id)));
  try{localStorage.setItem("liveEarthSelectedButton",id)}catch(e){}
  if(id==="earth"){status.hidden=true;return}
   if(id==="sun"||id==="moon"){selected="earth";buttons.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.view==="earth")));status.hidden=true;return}
  status.hidden=false;
  status.textContent= id==="location" ? "Location tools are not connected yet. Your globe remains available." : `${labels[id]} view is not connected yet. Your Earth globe remains available.`;
  window.setTimeout(()=>{if(selected===id)status.hidden=true},2600);
 }
 buttons.forEach(button=>button.addEventListener("click",()=>activate(button.dataset.view)));
 activate(selected);
 initializing=false;
})();
</script>

<script id="le-controller-bootstrap">
(() => {
  'use strict';
  // Keep the uncontrolled first page lightweight: the service worker stages these files

  if (window.__leBootControlledAtStart !== true || !('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
  const assets = [
    './orb-controls-v4.js',
    './earth-mode-navigation.js',
    './location-scanner.js',
    './view-manager.js',
    './view-module-registry.js',

    './sky-view-controller.js',
    './moon-view-controller.js',
    './moon-lunar-interface.js',
    './update-manager.js'
  ];
  function loadScript(src, module = false) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      if (module) script.type = 'module';
      script.src = src;
      script.async = false;
      script.onload = () => resolve();
      script.onerror = () => reject(new Error('Required startup script failed: ' + src));
      document.body.appendChild(script);
    });
  }
  assets.reduce((chain, src) => chain.then(() => loadScript(src)), Promise.resolve())
    .then(() => loadScript('./data-recovery.js', true))
    .catch(error => {
      console.error('[LIVE // EARTH] Controller startup failed.', error);
      window.dispatchEvent(new ErrorEvent('error', {message:error.message, error, cancelable:true}));
