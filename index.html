<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<meta name="description" content="LIVE // EARTH — a quiet, interactive 3D Earth globe.">
<title>LIVE // EARTH</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;background:#02050b;color:#eaf5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050b;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.brand{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 17px);left:19px;pointer-events:none;font-size:clamp(13px,2.8vw,17px);font-weight:800;letter-spacing:.19em;text-shadow:0 2px 16px #000}
.brand span{color:#65d9ff}.hint{position:absolute;z-index:2;left:50%;bottom:calc(env(safe-area-inset-bottom) + 23px);transform:translateX(-50%);pointer-events:none;color:#b6c7d9;font-size:10px;letter-spacing:.19em;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 12px #000;opacity:.78}
.status{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);max-width:82vw;padding:13px 16px;border:1px solid #24384d;border-radius:12px;background:#08111ee8;color:#c7d9e9;text-align:center;font-size:13px;line-height:1.5}
.status[hidden]{display:none}@media(min-width:800px){.brand{left:28px;top:25px}.hint{bottom:28px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D Earth globe. Drag with one finger to rotate; zoom is fixed."></canvas>
<div class="brand">LIVE <span>//</span> EARTH</div>
<div id="status" class="status" role="status">Preparing Earth…</div>
<div class="hint">Drag with one finger to rotate</div>
<script type="module">
const canvas=document.querySelector('#scene'),status=document.querySelector('#status');
try {
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
  renderer.setSize(window.innerWidth,window.innerHeight,false);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.setClearColor(0x02050b,1);
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x02050b);
  const camera=new THREE.PerspectiveCamera(34,window.innerWidth/window.innerHeight,0.1,100);
  camera.position.set(0,0,4.15);
  scene.add(new THREE.AmbientLight(0x8aa7c8,1.25));
  const sun=new THREE.DirectionalLight(0xffffff,2.25);sun.position.set(-3,2,4);scene.add(sun);
  const fill=new THREE.DirectionalLight(0x245b9b,0.45);fill.position.set(4,-2,-3);scene.add(fill);
  const globeGroup=new THREE.Group();scene.add(globeGroup);
  const geometry=new THREE.SphereGeometry(1,96,64);
  const textureLoader=new THREE.TextureLoader();textureLoader.setCrossOrigin('anonymous');
  const texture=await new Promise((resolve,reject)=>textureLoader.load('https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57730/land_ocean_ice_2048.png',resolve,undefined,reject));
  texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),4);
  const earth=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({map:texture,roughness:1,metalness:0}));
  // Present a familiar hemisphere on first load.
  earth.rotation.y=-0.35;globeGroup.add(earth);
  const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(1.025,64,48),new THREE.MeshBasicMaterial({color:0x3d9cff,transparent:true,opacity:0.10,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));globeGroup.add(atmosphere);
  // Sparse distant stars, generated locally (no additional image requests).
  const positions=[];let seed=721;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  for(let i=0;i<500;i++){const r=18+rand()*25,a=rand()*Math.PI*2,z=rand()*2-1,s=Math.sqrt(1-z*z);positions.push(r*s*Math.cos(a),r*z,r*s*Math.sin(a));}
  const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xa9c9ec,size:0.045,sizeAttenuation:true,transparent:true,opacity:0.72})));
  status.hidden=true;
  // Render only when needed to reduce idle battery use.
  let frame=0;const draw=()=>{if(frame)return;frame=requestAnimationFrame(()=>{frame=0;renderer.render(scene,camera);});};draw();
  // Only a single active pointer can rotate the globe. No zoom or pinch gestures.
  let activePointer=null,lastX=0,lastY=0,dragging=false;
  canvas.addEventListener('pointerdown',e=>{if(activePointer!==null)return;if(e.pointerType==='touch'&&e.isPrimary===false)return;activePointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;dragging=true;canvas.setPointerCapture?.(e.pointerId);e.preventDefault();},{passive:false});
  canvas.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==activePointer)return;e.preventDefault();const dx=e.clientX-lastX,dy=e.clientY-lastY;globeGroup.rotation.y+=dx*0.005;globeGroup.rotation.x=Math.max(-1.15,Math.min(1.15,globeGroup.rotation.x+dy*0.003));lastX=e.clientX;lastY=e.clientY;draw();},{passive:false});
  const endDrag=e=>{if(e.pointerId===activePointer){dragging=false;activePointer=null;}};
  canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);canvas.addEventListener('lostpointercapture',endDrag);
  const resize=()=>{const w=window.innerWidth,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));renderer.setSize(w,h,false);draw();};
  window.addEventListener('resize',resize,{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(frame)cancelAnimationFrame(frame);frame=0;}else{draw();}});
  if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}catch(err){console.error(err);status.hidden=false;status.textContent='Earth could not load. Please check your internet connection and refresh.';}
</script>
</body>
</html>
