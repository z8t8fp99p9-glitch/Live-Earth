<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<title>LIVE // EARTH</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;background:#02050b;color:#eaf5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050b;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.brand{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 17px);left:19px;pointer-events:none;font-size:clamp(13px,2.8vw,17px);font-weight:800;letter-spacing:.19em}
.brand span{color:#65d9ff}
.status{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);max-width:84vw;padding:13px 16px;border:1px solid #24384d;border-radius:12px;background:#08111ee8;color:#c7d9e9;text-align:center;font-size:13px;line-height:1.5}
.status[hidden]{display:none}
#navButtons{position:absolute;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom) + 49px);transform:translateX(-50%);width:min(94vw,520px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:clamp(2px,1.2vw,9px)}
.orbButton{appearance:none;-webkit-appearance:none;min-width:0;padding:0 0 2px;border:0;background:transparent;color:#dbeaf7;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 clamp(8px,2.4vw,11px)/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.orbShell{position:relative;display:block;width:clamp(49px,14.2vw,76px);aspect-ratio:1;border-radius:50%;isolation:isolate;transform:translateZ(0);transition:transform .22s ease,filter .22s ease;filter:drop-shadow(0 5px 7px #000b) drop-shadow(0 0 3px #7dcfff30)}
.orbImage{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%;user-select:none;-webkit-user-drag:none}
/* Consolidated global orb material + state visuals. Geometry and navigation placement stay unchanged. */
.orbShell{
  overflow:visible;
  border:1px solid rgba(220,245,255,.38);
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(94,149,190,.035) 42%,rgba(0,5,15,.42));
  box-shadow:inset 1px 1px 3px rgba(255,255,255,.34),inset -2px -3px 6px rgba(0,0,0,.62),0 4px 8px rgba(0,0,0,.58),0 0 0 1px rgba(160,220,255,.06);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  transition:filter .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.orbImage{clip-path:circle(48.8% at 50% 50%)}
.orbShell:before{
  content:"";position:absolute;inset:1.5%;z-index:2;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 28% 13%,rgba(255,255,255,.56),transparent 23%),radial-gradient(ellipse at 72% 88%,var(--orb-tint-soft),transparent 38%),linear-gradient(138deg,rgba(255,255,255,.22),rgba(255,255,255,.035) 25%,transparent 44%,rgba(255,255,255,.02) 68%,rgba(255,255,255,.18));
  box-shadow:inset 1px 1px 2px rgba(255,255,255,.68),inset -2px -3px 5px rgba(0,0,0,.50)
}
.orbShell:after{
  content:"";position:absolute;z-index:3;left:17%;top:7%;width:37%;height:12%;border-radius:50%;transform:rotate(-34deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.92),rgba(255,255,255,.20),transparent);filter:blur(.8px);opacity:.82;pointer-events:none
}
.orbShine{
  position:absolute;inset:1%;z-index:4;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:.18;
  background:radial-gradient(ellipse at 26% 13%,rgba(255,255,255,.25),transparent 28%),conic-gradient(from 210deg,var(--orb-tint-soft),rgba(255,255,255,.02),var(--orb-tint),rgba(255,255,255,.025),var(--orb-tint-soft));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);transition:opacity .22s ease
}
.orbButton[data-view="earth"]{--orb-tint:rgba(30,190,160,.32);--orb-tint-soft:rgba(40,220,175,.10)}
.orbButton[data-view="moon"]{--orb-tint:rgba(155,195,255,.34);--orb-tint-soft:rgba(190,220,255,.12)}
.orbButton[data-view="sun"]{--orb-tint:rgba(255,155,35,.36);--orb-tint-soft:rgba(255,190,65,.12)}
.orbButton[data-view="location"]{--orb-tint:rgba(255,40,75,.40);--orb-tint-soft:rgba(255,45,85,.13)}
.orbButton[data-view="stacks"]{--orb-tint:rgba(30,220,235,.36);--orb-tint-soft:rgba(50,240,245,.12)}
.orbButton .orbShell{filter:brightness(.88) saturate(.88) drop-shadow(0 4px 7px #000b) drop-shadow(0 0 4px var(--orb-tint));}
.orbButton .orbShine{opacity:.20}
.orbButton[aria-pressed="true"] .orbShell,
.orbButton[data-view="earth"].le-earth-exploration-active .orbShell{
  filter:brightness(1.08) saturate(1.10) drop-shadow(0 5px 8px #000b) drop-shadow(0 0 7px var(--orb-tint));
  border-color:rgba(235,250,255,.86);
  box-shadow:inset 1px 1px 3px rgba(255,255,255,.62),inset -2px -3px 5px rgba(0,0,0,.52),
    0 0 0 1.5px var(--orb-tint),0 0 11px var(--orb-tint),0 5px 10px rgba(0,0,0,.58)
}
.orbButton[aria-pressed="true"] .orbShine,
.orbButton[data-view="earth"].le-earth-exploration-active .orbShine{opacity:.42}
.orbButton[data-view="location"][aria-pressed="true"] .orbShell{
  border-color:rgba(255,170,180,.92);
  box-shadow:inset 1px 1px 3px rgba(255,255,255,.70),inset -2px -3px 5px rgba(0,0,0,.52),
    0 0 0 1.5px rgba(255,50,80,.50),0 0 12px rgba(255,35,75,.62),0 5px 10px rgba(0,0,0,.58)
}
.orbButton[aria-pressed="true"] .orbLabel,
.orbButton[data-view="earth"].le-earth-exploration-active .orbLabel{color:#f4fbff;opacity:1}
@media(prefers-reduced-motion:no-preference){
  .orbShine{animation:glassSheen 8s ease-in-out infinite alternate}
  .orbButton[data-view="moon"] .orbShine{animation-delay:-1.5s}
  .orbButton[data-view="sun"] .orbShine{animation-delay:-3s}
  .orbButton[data-view="location"] .orbShine{animation-delay:-4.5s}
  .orbButton[data-view="stacks"] .orbShine{animation-delay:-6s}
}
@keyframes glassSheen{from{opacity:.16;filter:hue-rotate(-5deg)}to{opacity:.26;filter:hue-rotate(5deg)}}
@media(prefers-reduced-motion:reduce){.orbShell,.orbShine{animation:none!important;transition:none!important}}
.orbLabel{max-width:100%;white-space:nowrap;text-shadow:0 1px 7px #000,0 0 9px #6cbfff33;opacity:.82;transition:opacity .22s ease,color .22s ease}
.orbButton:active .orbShell{filter:brightness(1.02) saturate(.96)}
.orbButton:focus-visible{outline:2px solid #8de1ff;outline-offset:5px;border-radius:12px}
@media(min-width:600px){#navButtons{bottom:38px;gap:10px}.orbShell{width:clamp(68px,8vw,88px)}.orbButton{font-size:11px}}
@media(max-height:700px){#navButtons{bottom:calc(env(safe-area-inset-bottom) + 42px)}.orbShell{width:clamp(43px,11vw,63px)}}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D Earth globe. Drag with one finger to rotate; pinch out to reveal the Moon orbit."></canvas>
<div class="brand">LIVE <span>//</span> EARTH</div>
<div id="status" class="status">Preparing Earth…</div>
<nav id="navButtons" aria-label="Main navigation">
  <button class="orbButton" data-view="earth" aria-label="Earth" aria-pressed="true"><span class="orbShell"><img class="orbImage" src="./earth.webp" alt="" draggable="false"><span class="orbShine"></span></span><span class="orbLabel">Earth</span></button>
  <button class="orbButton" data-view="moon" aria-label="Moon" aria-pressed="false"><span class="orbShell"><img class="orbImage" src="./moon.webp" alt="" draggable="false"><span class="orbShine"></span></span><span class="orbLabel">Moon</span></button>
  <button class="orbButton" data-view="sun" aria-label="Sun" aria-pressed="false"><span class="orbShell"><img class="orbImage" src="./sun.webp" alt="" draggable="false"><span class="orbShine"></span></span><span class="orbLabel">Sun</span></button>
  <button class="orbButton" data-view="location" aria-label="Location" aria-pressed="false"><span class="orbShell"><img class="orbImage" src="./location.webp" alt="" draggable="false"><span class="orbShine"></span></span><span class="orbLabel">Location</span></button>
  <button class="orbButton" data-view="stacks" aria-label="Stacks" aria-pressed="false"><span class="orbShell"><img class="orbImage" src="./stacks.webp" alt="" draggable="false"><span class="orbShine"></span></span><span class="orbLabel">Stacks</span></button>
</nav>
<script type="module">
import('./data-store.js').then(m=>m.initializeLocalDatabase()).then(result=>console.info('[LIVE // EARTH] Local database ready; save/retrieve self-test passed.',result)).catch(error=>console.warn('[LIVE // EARTH] Local database unavailable; globe remains independent.',error));
const canvas=document.querySelector('#scene'),status=document.querySelector('#status');const showError=m=>{status.hidden=false;status.textContent=m};const loadTexture=(T,url)=>new Promise((resolve,reject)=>{const l=new T.TextureLoader();l.setCrossOrigin('anonymous');l.load(url,resolve,undefined,()=>reject(new Error('Image request failed: '+url)))});
try{let T;try{T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js')}catch(e){T=await import('https://unpkg.com/three@0.180.0/build/three.module.js')}const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=T.SRGBColorSpace;renderer.setClearColor(0x02050b,1);const scene=new T.Scene();scene.background=new T.Color(0x02050b);const camera=new T.PerspectiveCamera(34,innerWidth/Math.max(1,innerHeight),.1,180);function fitCamera(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);camera.aspect=w/h;camera.fov=34;camera.updateProjectionMatrix();const d=.75*Math.min(w,h);camera.position.set(0,0,h/(d*Math.tan(T.MathUtils.degToRad(camera.fov/2))));camera.lookAt(0,0,0)}fitCamera();
scene.add(new T.AmbientLight(0x8aa7c8,.24));const sun=new T.DirectionalLight(0xffffff,2.15);sun.position.set(-3,2,4);scene.add(sun);const fill=new T.DirectionalLight(0x245b9b,.055);fill.position.set(4,-2,-3);scene.add(fill);const group=new T.Group();scene.add(group);let texture;try{texture=await loadTexture(T,'https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57730/land_ocean_ice_2048.png')}catch(e){console.warn('NASA texture failed; trying fallback',e);texture=await loadTexture(T,'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg')}texture.colorSpace=T.SRGBColorSpace;texture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),4);const earth=new T.Mesh(new T.SphereGeometry(1,96,64),new T.MeshStandardMaterial({map:texture,roughness:1,metalness:0}));earth.rotation.y=-.35;group.add(earth);group.add(new T.Mesh(new T.SphereGeometry(1.025,64,48),new T.MeshBasicMaterial({color:0x329dff,transparent:true,opacity:.13,side:T.BackSide,blending:T.AdditiveBlending,depthWrite:false})));
let moonSystem={update:()=>null};try{const moonModule=await import('./moon-orbit.js');moonSystem=moonModule.createMoonOrbit(T,group,{earthRadius:1,samples:721,displayDistanceFactor:0.04,displayMoonRadius:0.32});}catch(moonError){console.warn('[LIVE // EARTH] Moon layer unavailable; preserving Earth scene.',moonError);}const pos=[];let seed=721;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<500;i++){const r=18+rand()*25,a=rand()*Math.PI*2,z=rand()*2-1,s=Math.sqrt(1-z*z);pos.push(r*s*Math.cos(a),r*z,r*s*Math.sin(a))}const sg=new T.BufferGeometry();sg.setAttribute('position',new T.Float32BufferAttribute(pos,3));scene.add(new T.Points(sg,new T.PointsMaterial({color:0xa9c9ec,size:.045,transparent:true,opacity:.72})));status.hidden=true;let frame=0;const draw=()=>{if(frame)return;frame=requestAnimationFrame(()=>{frame=0;renderer.render(scene,camera)})};draw();let moonTick=Date.now();const moonClock=setInterval(()=>{if(document.hidden)return;const now=Date.now();if(now-moonTick>=30000){moonTick=now;moonSystem.update(new Date(now));draw()}},10000);let active=null,x=0,y=0,drag=false;canvas.addEventListener('pointerdown',e=>{if(active!==null||e.pointerType==='touch'&&!e.isPrimary)return;active=e.pointerId;x=e.clientX;y=e.clientY;drag=true;canvas.setPointerCapture?.(e.pointerId);e.preventDefault()},{passive:false});canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==active)return;group.rotation.y+=(e.clientX-x)*.009;group.rotation.x=Math.max(-1.15,Math.min(1.15,group.rotation.x+(e.clientY-y)*.0055));x=e.clientX;y=e.clientY;draw()},{passive:false});const end=e=>{if(e.pointerId===active){drag=false;active=null}};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);addEventListener('resize',()=>{renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight,false);fitCamera();draw()},{passive:true});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{fitCamera();renderer.setSize(innerWidth,innerHeight,false);draw()},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){if(frame)cancelAnimationFrame(frame);frame=0}else draw()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}catch(e){console.error('LIVE // EARTH failure',e);showError('Earth failed to load: '+(e?.message||String(e)))}
</script>
<script>
(()=>{
 const buttons=[...document.querySelectorAll(".orbButton")];
 const status=document.querySelector("#status");
 let selected="earth", initializing=true;
 try{selected=localStorage.getItem("liveEarthSelectedButton")||"earth"}catch(e){}
 const supported=new Set(["earth","moon","sun","location","stacks"]);
 if(!supported.has(selected))selected="earth";
 const labels={earth:"Earth",moon:"Moon",sun:"Sun",location:"Location",stacks:"Stacks"};
 function activate(id){
  selected=id;
  buttons.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.view===id)));
  try{localStorage.setItem("liveEarthSelectedButton",id)}catch(e){}
  if(id==="earth"){status.hidden=true;return}
   if(id==="sun"||id==="moon"){selected="earth";buttons.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.view==="earth")));status.hidden=true;return}
  status.hidden=false;
  status.textContent= id==="location" ? "Location tools are not connected yet. Your globe remains available." : `${labels[id]} view is not connected yet. Your Earth globe remains available.`;
  window.setTimeout(()=>{if(selected===id)status.hidden=true},2600);
 }
 buttons.forEach(button=>button.addEventListener("click",()=>activate(button.dataset.view)));
 activate(selected);
 initializing=false;
})();
</script>
</body>
</html>
