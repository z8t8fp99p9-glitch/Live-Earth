<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a12">
  <meta name="description" content="LIVE // EARTH — a quiet, fixed global map view.">
  <title>LIVE // EARTH</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root{color-scheme:dark;--bg:#050a12;--text:#eef6ff;--muted:#b7c7d9;--cyan:#61d9ff}
    *{box-sizing:border-box}
    html,body{height:100%;width:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #map{position:fixed;inset:0;background:#07111f;z-index:0}
    .leaflet-container{background:#07111f;outline:0;touch-action:pan-x pan-y}
    .leaflet-control-zoom{display:none!important}
    .leaflet-control-attribution{font-size:10px!important;background:rgba(3,9,17,.72)!important;color:#d2e0ee!important;border-radius:6px 0 0 0;padding:2px 5px!important}
    .leaflet-control-attribution a{color:#8ddfff!important}
    .brand{position:fixed;z-index:500;top:calc(env(safe-area-inset-top) + 16px);left:18px;pointer-events:none;text-shadow:0 2px 14px #000;letter-spacing:.16em;font-weight:800;font-size:clamp(13px,2.8vw,18px)}
    .brand span{color:var(--cyan)}
    .caption{position:fixed;z-index:500;left:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);pointer-events:none;color:#d7e5f3;text-shadow:0 2px 14px #000;font-size:11px;letter-spacing:.15em;text-transform:uppercase;opacity:.88}
    .shade{position:fixed;inset:0;z-index:400;pointer-events:none;background:linear-gradient(180deg,rgba(2,7,14,.5),transparent 18%,transparent 78%,rgba(2,7,14,.32))}
    .message{position:fixed;z-index:600;left:50%;top:50%;transform:translate(-50%,-50%);width:min(82vw,360px);padding:18px;border:1px solid #28435b;border-radius:16px;background:rgba(5,12,22,.92);color:var(--muted);text-align:center;line-height:1.5;backdrop-filter:blur(12px)}
    .message[hidden]{display:none}
    @media(min-width:900px){.brand{left:28px;top:24px}.caption{left:28px;bottom:26px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main id="map" aria-label="Fixed, non-interactive world map"></main>
  <div class="shade" aria-hidden="true"></div>
  <div class="brand">LIVE <span>//</span> EARTH</div>
  <div class="caption">One planet · One view</div>
  <div id="mapMessage" class="message" role="status">Loading the world map…</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    (function(){
      const message=document.getElementById('mapMessage');
      if(!window.L){message.textContent='The map library could not load. Check your internet connection and refresh.';return;}
      const map=L.map('map',{
        center:[18,0],zoom:2,minZoom:2,maxZoom:2,zoomControl:false,attributionControl:true,
        dragging:false,touchZoom:false,doubleClickZoom:false,scrollWheelZoom:false,boxZoom:false,
        keyboard:false,tap:false,zoomSnap:1,zoomDelta:1,worldCopyJump:false,preferCanvas:true
      });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        minZoom:2,maxZoom:2,noWrap:true,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a> contributors',
        crossOrigin:true
      }).addTo(map);
      map.on('tileerror',function(){message.hidden=false;message.textContent='Some map tiles could not load. The map needs an internet connection.';});
      map.on('load',function(){message.hidden=true;});
      setTimeout(function(){if(message.textContent==='Loading the world map…')message.hidden=true;},6500);
      window.addEventListener('resize',function(){map.invalidateSize({animate:false});});
      if('serviceWorker' in navigator && location.protocol.startsWith('http')){
        window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
      }
    })();
  </script>
</body>
</html>
