<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<title>LIVE // EARTH</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/Widgets/widgets.css">
<style>
:root{color-scheme:dark;background:#02050b;color:#eaf5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050b;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#space{position:absolute;inset:0;pointer-events:none;background:
radial-gradient(1px 1px at 12% 17%,#d9edffb0 45%,transparent),
radial-gradient(1px 1px at 79% 20%,#c9e4ff9c 45%,transparent),
radial-gradient(1px 1px at 24% 73%,#d9edff8c 45%,transparent),
radial-gradient(1px 1px at 87% 68%,#d9edff9c 45%,transparent),
radial-gradient(1px 1px at 62% 85%,#c9e4ff8c 45%,transparent),
radial-gradient(1px 1px at 42% 11%,#fff8 45%,transparent)}
#globe{position:absolute;inset:0;width:100%;height:100%;background:transparent}
.cesium-viewer,.cesium-viewer-cesiumWidgetContainer,.cesium-widget,.cesium-widget canvas{position:absolute!important;inset:0;width:100%!important;height:100%!important}
.cesium-viewer-bottom,.cesium-viewer-toolbar,.cesium-viewer-fullscreenContainer{display:none!important}
.cesium-widget-credits{display:block!important;left:8px!important;right:auto!important;bottom:5px!important;opacity:.45!important;font-size:8px!important}
.brand{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 17px);left:19px;pointer-events:none;font-size:clamp(13px,2.8vw,17px);font-weight:800;letter-spacing:.19em;text-shadow:0 1px 8px #000}
.brand span{color:#65d9ff}
#orbit{position:absolute;z-index:1;left:50%;top:53%;width:98vw;height:43vw;max-height:56vh;transform:translate(-50%,-50%) rotate(-7deg);border:1px solid #9bcfff1d;border-radius:50%;box-shadow:0 0 0 1px #9bcfff08;pointer-events:none}
#orbit:after{content:"";position:absolute;inset:-1px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#b9dfff00 0 7px,#b9dfff18 8px 9px,transparent 10px 17px);opacity:.3;mask:linear-gradient(90deg,#000,transparent 30%,transparent 70%,#000)}
#moon-preview{position:absolute;z-index:2;left:clamp(20px,22vw,420px);top:35%;width:clamp(62px,8.4vw,112px);aspect-ratio:1;border-radius:50%;object-fit:cover;filter:drop-shadow(0 0 12px #b9dfff16);pointer-events:none;opacity:.84}
#navButtons{position:absolute;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom) + 49px);transform:translateX(-50%);width:min(94vw,520px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:clamp(2px,1.2vw,9px)}
.orbButton{appearance:none;-webkit-appearance:none;min-width:0;padding:0 0 2px;border:0;background:transparent;color:#dbeaf7;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 clamp(8px,2.4vw,11px)/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.orbShell{position:relative;display:block;width:clamp(49px,14.2vw,76px);aspect-ratio:1;border-radius:50%;isolation:isolate;transform:translateZ(0);overflow:hidden;border:1px solid rgba(220,245,255,.56);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(94,149,190,.045) 42%,rgba(0,5,15,.42));box-shadow:inset 1px 1px 2px #ffffff6b,inset -2px -3px 5px #0009,0 4px 8px #0009,0 0 0 1px #a0dcff14;filter:drop-shadow(0 4px 7px #000b)}
.orbImage{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%;clip-path:circle(48.8% at 50% 50%);user-select:none;-webkit-user-drag:none}
.orbShell:before{content:"";position:absolute;inset:1.5%;z-index:2;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at 28% 13%,#ffffffa3,transparent 22%),linear-gradient(138deg,#ffffff3d,#ffffff09 25%,transparent 44%,#ffffff05 68%,#ffffff33);box-shadow:inset 1px 1px 2px #ffffffbd,inset -2px -3px 5px #0008}
.orbShell:after{content:"";position:absolute;z-index:3;left:17%;top:7%;width:37%;height:12%;border-radius:50%;transform:rotate(-34deg);background:linear-gradient(90deg,transparent,#fffffff2,#ffffff3d,transparent);filter:blur(.8px);opacity:.82;pointer-events:none}
.orbLabel{max-width:100%;white-space:nowrap;text-shadow:0 1px 7px #000,0 0 9px #6cbfff33;opacity:.82}
.orbButton:nth-child(1) .orbShell{box-shadow:inset 1px 1px 3px #ffffff70,inset -2px -3px 5px #00152a99,0 4px 8px #000a,0 0 9px #27aaff44}
.orbButton:nth-child(2) .orbShell{box-shadow:inset 1px 1px 3px #ffffff70,inset -2px -3px 5px #020817aa,0 4px 8px #000a,0 0 9px #c8e6ff55}
.orbButton:nth-child(3) .orbShell{box-shadow:inset 1px 1px 3px #fff8c4a0,inset -2px -3px 5px #260c00aa,0 4px 8px #000a,0 0 9px #ffb34766}
.orbButton:nth-child(4) .orbShell{box-shadow:inset 1px 1px 3px #ffdbe8a0,inset -2px -3px 5px #22000faa,0 4px 8px #000a,0 0 9px #ff5c9866}
.orbButton:nth-child(5) .orbShell{box-shadow:inset 1px 1px 3px #d6ffffa0,inset -2px -3px 5px #001a22aa,0 4px 8px #000a,0 0 9px #55f5ff66}
#message{position:absolute;z-index:10;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translateX(-50%);max-width:88vw;padding:8px 12px;border:1px solid #9bdcff30;border-radius:12px;background:#06101edb;color:#bfd8e8;font-size:11px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#message.show{opacity:1}
#le-quality-controls[hidden]{display:none!important}
@media(max-height:560px){#le-quality-controls{bottom:calc(env(safe-area-inset-bottom) + 100px)}}
@media(min-width:600px){#navButtons{bottom:38px;gap:10px}.orbShell{width:clamp(68px,8vw,88px)}.orbButton{font-size:11px}}
@media(max-height:700px){#navButtons{bottom:calc(env(safe-area-inset-bottom) + 42px)}.orbShell{width:clamp(43px,11vw,63px)}}
@media(max-width:600px){</style>
<script>window.CESIUM_BASE_URL="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/";</script>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/Cesium.js"></script>
</head>
<body>
<div id="space" aria-hidden="true"></div>
<div id="orbit" aria-hidden="true"></div>
<img id="moon-preview" src="./moon.webp" alt="" draggable="false">
<div id="globe" aria-label="Cesium experimental Earth globe"></div>
<div class="brand">LIVE <span>//</span> EARTH</div>

<div id="message" role="status" aria-live="polite"></div>
<nav id="navButtons" aria-label="LIVE Earth orb design preview">
  <button class="orbButton" data-view="earth" aria-label="Earth prototype"><span class="orbShell"><img class="orbImage" src="./earth.webp" alt="" draggable="false"></span><span class="orbLabel">Earth</span></button>
  <button class="orbButton" data-view="moon" aria-label="Moon design preview"><span class="orbShell"><img class="orbImage" src="./moon.webp" alt="" draggable="false"></span><span class="orbLabel">Moon</span></button>
  <button class="orbButton" data-view="sun" aria-label="Sun design preview"><span class="orbShell"><img class="orbImage" src="./sun.webp" alt="" draggable="false"></span><span class="orbLabel">Sun</span></button>
  <button class="orbButton" data-view="location" aria-label="Location design preview"><span class="orbShell"><img class="orbImage" src="./location.webp" alt="" draggable="false"></span><span class="orbLabel">Location</span></button>
  <button class="orbButton" data-view="stacks" aria-label="Stacks design preview"><span class="orbShell"><img class="orbImage" src="./stacks.webp" alt="" draggable="false"></span><span class="orbLabel">Stacks</span></button>
</nav>
<script>
(function(){
  const message=document.getElementById("message");
  function tell(text){message.textContent=text;message.classList.add("show");clearTimeout(tell.timer);tell.timer=setTimeout(()=>message.classList.remove("show"),2300);}
  document.querySelectorAll(".orbButton").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.view==="earth"){
      if(window.LiveEarthScene.isUnlocked()) window.LiveEarthScene.lock();
      else window.LiveEarthScene.unlock();
      return;
    }
    if(window.LiveEarthScene && window.LiveEarthScene.isUnlocked()) window.LiveEarthScene.lock();
    tell(({moon:"Moon preview remains available through the existing Moon orb artwork.",sun:"Sun preview remains available through the existing Sun orb artwork.",location:"Location feature remains available through the existing Location orb.",stacks:"Stacks feature remains available through the existing Stacks orb."})[b.dataset.view]||"");
  }));
  if(!window.Cesium){tell("Cesium could not load. Check your connection and reload this prototype.");return;}
  try{
    const C=window.Cesium;
    const viewer=new C.Viewer("globe",{
      animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,
      sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,
      selectionIndicator:false,shouldAnimate:true,requestRenderMode:false,
      imageryProvider:new C.UrlTemplateImageryProvider({
        url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        credit:"© OpenStreetMap contributors",
        maximumLevel:19
      }),
      terrainProvider:new C.EllipsoidTerrainProvider()
    });
    window.viewer=viewer;
    let unlocked=false, homeDestination=null, homeOrientation=null;
    const qualityControls=document.createElement("div");
    qualityControls.id="le-quality-controls";
    qualityControls.hidden=true;
    qualityControls.innerHTML='<button type="button" data-quality="basic" aria-pressed="true">BASIC</button><button type="button" data-quality="hd" aria-pressed="false">HD</button>';
    Object.assign(qualityControls.style,{position:"absolute",zIndex:"12",left:"50%",bottom:"calc(env(safe-area-inset-bottom) + 139px)",transform:"translateX(-50%)",display:"flex",gap:"8px",padding:"6px",border:"1px solid #b6e6ff40",borderRadius:"999px",background:"#071321cc",backdropFilter:"blur(16px)"});
    qualityControls.querySelectorAll("button").forEach(button=>{
      Object.assign(button.style,{minWidth:"78px",padding:"10px 13px",border:"1px solid #b6e6ff40",borderRadius:"999px",background:"#ffffff0d",color:"#eaf5ff",font:"650 11px -apple-system,sans-serif",letterSpacing:".08em"});
      button.addEventListener("click",()=>{
        const hd=button.dataset.quality==="hd";
        viewer.resolutionScale=hd?Math.min(window.devicePixelRatio||1,1.5):Math.min(window.devicePixelRatio||1,1);
        viewer.scene.requestRender();
        qualityControls.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));
      });
    });
    document.body.appendChild(qualityControls);
    window.LiveEarthScene={
      unlock(){if(unlocked)return;unlocked=true;homeDestination=viewer.camera.positionWC.clone();homeOrientation={heading:viewer.camera.heading,pitch:viewer.camera.pitch,roll:viewer.camera.roll};qualityControls.hidden=false;viewer.camera.flyTo({destination:C.Cartesian3.fromDegrees(0,15,9500000),duration:.65});},
      lock(){if(!unlocked)return;unlocked=false;qualityControls.hidden=true;viewer.camera.flyTo({destination:C.Cartesian3.fromDegrees(18,18,13700000),duration:.65});},
      isUnlocked(){return unlocked;},
      setQuality(value){const b=qualityControls.querySelector('[data-quality="'+(value==="hd"?"hd":"basic")+'"]');if(b)b.click();return value;},
      getQuality(){return qualityControls.querySelector('[aria-pressed="true"]')?.dataset.quality||"basic";}
    };
    viewer.scene.backgroundColor=C.Color.fromCssColorString("#02050b");
    viewer.scene.globe.enableLighting=true;
    viewer.scene.globe.dynamicAtmosphereLighting=true;
    viewer.scene.globe.dynamicAtmosphereLightingFromSun=true;
    viewer.scene.globe.showGroundAtmosphere=true;
    viewer.scene.globe.showWaterEffect=false;
    viewer.scene.globe.lambertDiffuseMultiplier=0.9;
    viewer.scene.skyAtmosphere.show=true;
    viewer.scene.sun.show=true;
    viewer.scene.moon.show=false;
    viewer.clock.currentTime=C.JulianDate.now();
    viewer.clock.shouldAnimate=true;
    viewer.clock.multiplier=1;
    viewer.scene.screenSpaceCameraController.enableRotate=true;
    viewer.scene.screenSpaceCameraController.enableTranslate=true;
    viewer.scene.screenSpaceCameraController.enableZoom=true;
    viewer.scene.screenSpaceCameraController.enableTilt=true;
    viewer.scene.screenSpaceCameraController.enableLook=false;
    viewer.scene.screenSpaceCameraController.minimumZoomDistance=6800000;
    viewer.scene.screenSpaceCameraController.maximumZoomDistance=42000000;
    viewer.camera.setView({
      destination:C.Cartesian3.fromDegrees(0,18,13700000),
      orientation:{heading:0,pitch:0,roll:0}
    });
    viewer.scene.globe.tileLoadProgressEvent.addEventListener(remaining=>{
      if(remaining===0)document.documentElement.dataset.tilesReady="true";
    });
    window.addEventListener("pagehide",()=>{try{viewer.destroy();}catch(e){}},{once:true});
  }catch(error){
    console.error("[LIVE // EARTH] Cesium prototype failed",error);
    tell("Cesium failed to initialize. Original homepage is untouched.");
  }
})();
</script>
</body>
</html>
