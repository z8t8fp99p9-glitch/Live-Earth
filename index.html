<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<title>LIVE // EARTH — New Map Launch Test</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#02050b;color:#eaf5ff}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,#10273c 0%,#050c17 52%,#02050b 100%)}
main{width:min(100%,440px);padding:22px;border:1px solid #b6e6ff35;border-radius:26px;background:linear-gradient(145deg,#102032df,#050b16ee);box-shadow:inset 1px 1px 2px #ffffff20,0 18px 45px #000a}
.brand{font-size:12px;font-weight:800;letter-spacing:.16em;color:#eaf5ff}.brand span{color:#65d9ff}
h1{font-size:25px;line-height:1.15;margin:22px 0 8px}p{font-size:13px;line-height:1.6;color:#a8bfd1}
button{width:100%;margin-top:12px;padding:16px;border:1px solid #8ecfff40;border-radius:16px;text-align:left;background:#ffffff09;color:#edf8ff;font:650 15px -apple-system,BlinkMacSystemFont,sans-serif}
button:active{transform:scale(.99)}button small{display:block;margin-top:5px;color:#9fb6ca;font-size:12px;font-weight:400}
.note{margin-top:18px;font-size:11px;color:#7e98ae}
</style>
</head>
<body><main>
<div class="brand">LIVE <span>//</span> EARTH</div>
<h1>Choose your Earth</h1>
<p>This isolated test checks the new launch rule. Opening a map must not depend on Location permission.</p>
<button id="basic">Basic Live <small>Interactive 2D map · opens without GPS</small></button>
<button id="hd">HD Live <small>3D map · next development stage</small></button>
<p class="note">NEW TEST BUILD · Existing homepage files are untouched.</p>
</main>
<script>
document.getElementById('basic').addEventListener('click',()=>{location.href='./basic-map.html';});
document.getElementById('hd').addEventListener('click',()=>{alert('HD Live is the next stage. Basic Live launch is being tested first.');});
</script>
</body></html>
