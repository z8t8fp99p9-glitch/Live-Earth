<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<title>LIVE // EARTH</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;background:#02050b;color:#eaf5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050b;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.brand{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 17px);left:19px;pointer-events:none;font-size:clamp(13px,2.8vw,17px);font-weight:800;letter-spacing:.19em}
.brand span{color:#65d9ff}
.hint{position:absolute;z-index:2;left:50%;bottom:calc(env(safe-area-inset-bottom) + 15px);transform:translateX(-50%);pointer-events:none;color:#b6c7d9;font-size:9px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;opacity:.72}
.status{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);max-width:84vw;padding:13px 16px;border:1px solid #24384d;border-radius:12px;background:#08111ee8;color:#c7d9e9;text-align:center;font-size:13px;line-height:1.5}
.status[hidden]{display:none}
#navButtons{position:absolute;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom) + 39px);transform:translateX(-50%);width:min(94vw,520px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.navButton{appearance:none;-webkit-appearance:none;min-width:0;padding:12px 2px;border:1px solid #71819766;border-radius:10px;background:#09111dcc;color:#e7f2ff;font:600 clamp(9px,2.5vw,12px)/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.015em;box-shadow:0 5px 15px #0006;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:manipulation;cursor:pointer}
.navButton[aria-pressed="true"]{background:#d9f2ff;color:#07131e;border-color:#e8f8ff}
.navButton:focus-visible{outline:2px solid #8de1ff;outline-offset:3px}
.navButton:active{transform:scale(.97)}
@media(min-width:600px){#navButtons{bottom:30px;gap:10px}.navButton{padding:14px 8px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D Earth globe. Drag with one finger to rotate; globe diameter is 75% of the shortest screen dimension."></canvas>
<div class="brand">LIVE <span>//</span> EARTH</div>
<div id="status" class="status">Preparing Earth…</div>
<nav id="navButtons" aria-label="Main navigation">
  <button class="navButton" data-view="earth" aria-pressed="true">Earth</button>
  <button class="navButton" data-view="moon" aria-pressed="false">Moon</button>
  <button class="navButton" data-view="sun" aria-pressed="false">Sun</button>
  <button class="navButton" data-view="location" aria-pressed="false">Location</button>
  <button class="navButton" data-view="stacks" aria-pressed="false">Stacks</button>
</nav>
<div class="hint">Drag globe to rotate · Choose a button</div>
<script type="module">
import('./data-store.js').then(m=>m.initializeLocalDatabase()).then(result=>console.info('[LIVE // EARTH] Local database ready; save/retrieve self-test passed.',result)).catch(error=>console.warn('[LIVE // EARTH] Local database unavailable; globe remains independent.',error));
const canvas=document.querySelector('#scene'),status=document.querySelector('#status');const showError=m=>{status.hidden=false;status.textContent=m};const loadTexture=(T,url)=>new Promise((resolve,reject)=>{const l=new T.TextureLoader();l.setCrossOrigin('anonymous');l.load(url,resolve,undefined,()=>reject(new Error('Image request failed: '+url)))});
try{let T;try{T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js')}catch(e){T=await import('https://unpkg.com/three@0.180.0/build/three.module.js')}const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight,false);renderer.outputColorSpace=T.SRGBColorSpace;renderer.setClearColor(0x02050b,1);const scene=new T.Scene();scene.background=new T.Color(0x02050b);const camera=new T.PerspectiveCamera(34,innerWidth/Math.max(1,innerHeight),.1,100);function fitCamera(){const w=Math.max(1,document.documentElement.clientWidth||innerWidth),h=Math.max(1,document.documentElement.clientHeight||innerHeight);camera.aspect=w/h;camera.fov=34;camera.updateProjectionMatrix();const d=.75*Math.min(w,h);camera.position.set(0,0,h/(d*Math.tan(T.MathUtils.degToRad(camera.fov/2))));camera.lookAt(0,0,0)}fitCamera();
scene.add(new T.AmbientLight(0x8aa7c8,.24));const sun=new T.DirectionalLight(0xffffff,2.15);sun.position.set(-3,2,4);scene.add(sun);const fill=new T.DirectionalLight(0x245b9b,.055);fill.position.set(4,-2,-3);scene.add(fill);const group=new T.Group();scene.add(group);let texture;try{texture=await loadTexture(T,'https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57730/land_ocean_ice_2048.png')}catch(e){console.warn('NASA texture failed; trying fallback',e);texture=await loadTexture(T,'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg')}texture.colorSpace=T.SRGBColorSpace;texture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),4);const earth=new T.Mesh(new T.SphereGeometry(1,96,64),new T.MeshStandardMaterial({map:texture,roughness:1,metalness:0}));earth.rotation.y=-.35;group.add(earth);group.add(new T.Mesh(new T.SphereGeometry(1.025,64,48),new T.MeshBasicMaterial({color:0x329dff,transparent:true,opacity:.13,side:T.BackSide,blending:T.AdditiveBlending,depthWrite:false})));const pos=[];let seed=721;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<500;i++){const r=18+rand()*25,a=rand()*Math.PI*2,z=rand()*2-1,s=Math.sqrt(1-z*z);pos.push(r*s*Math.cos(a),r*z,r*s*Math.sin(a))}const sg=new T.BufferGeometry();sg.setAttribute('position',new T.Float32BufferAttribute(pos,3));scene.add(new T.Points(sg,new T.PointsMaterial({color:0xa9c9ec,size:.045,transparent:true,opacity:.72})));status.hidden=true;let frame=0;const draw=()=>{if(frame)return;frame=requestAnimationFrame(()=>{frame=0;renderer.render(scene,camera)})};draw();let active=null,x=0,y=0,drag=false;canvas.addEventListener('pointerdown',e=>{if(active!==null||e.pointerType==='touch'&&!e.isPrimary)return;active=e.pointerId;x=e.clientX;y=e.clientY;drag=true;canvas.setPointerCapture?.(e.pointerId);e.preventDefault()},{passive:false});canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==active)return;group.rotation.y+=(e.clientX-x)*.009;group.rotation.x=Math.max(-1.15,Math.min(1.15,group.rotation.x+(e.clientY-y)*.0055));x=e.clientX;y=e.clientY;draw()},{passive:false});const end=e=>{if(e.pointerId===active){drag=false;active=null}};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);addEventListener('resize',()=>{renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight,false);fitCamera();draw()},{passive:true});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{fitCamera();renderer.setSize(innerWidth,innerHeight,false);draw()},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){if(frame)cancelAnimationFrame(frame);frame=0}else draw()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}catch(e){console.error('LIVE // EARTH failure',e);showError('Earth failed to load: '+(e?.message||String(e)))}
</script>
<script>
(()=>{
 const buttons=[...document.querySelectorAll(".navButton")];
 const status=document.querySelector("#status");
 let selected="earth";
 try{selected=localStorage.getItem("liveEarthSelectedButton")||"earth"}catch(e){}
 const supported=new Set(["earth","moon","sun","location","stacks"]);
 if(!supported.has(selected))selected="earth";
 const labels={earth:"Earth",moon:"Moon",sun:"Sun",location:"Location",stacks:"Stacks"};
 function activate(id){
  selected=id;
  buttons.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.view===id)));
  try{localStorage.setItem("liveEarthSelectedButton",id)}catch(e){}
  if(id==="earth"){status.hidden=true;return}
  status.hidden=false;
  status.textContent= id==="location" ? "Location tools are not connected yet. Your globe remains available." : `${labels[id]} view is not connected yet. Your Earth globe remains available.`;
  window.setTimeout(()=>{if(selected===id)status.hidden=true},2600);
 }
 buttons.forEach(button=>button.addEventListener("click",()=>activate(button.dataset.view)));
 activate(selected);
})();
</script>
</body>
</html>
