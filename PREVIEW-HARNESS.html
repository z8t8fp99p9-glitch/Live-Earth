<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>LIVE // EARTH V88.7 Orbital Rail Harness</title><style>
:root{color-scheme:dark;background:#02050b;color:#eaf5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--le-orb-size-primary:clamp(49px,14.2vmin,76px)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050b}body{position:fixed;inset:0}.brand{position:fixed;z-index:2;top:calc(env(safe-area-inset-top) + 18px);left:20px;font-size:14px;font-weight:800;letter-spacing:.18em}.brand span{color:#58d9ff}.earth{position:absolute;left:50%;top:52%;width:min(78vmin,78vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 31% 27%,#46697c 0%,#1b3d5b 35%,#07152b 74%,#02050b 100%);box-shadow:inset -24px -14px 46px #000c,inset 7px 4px 16px #94d8ff35,0 0 0 3px #173c5b,0 0 22px #197acb22}.earth:before{content:"";position:absolute;inset:14% 27% 22% 17%;border-radius:45% 58% 49% 38%;transform:rotate(-24deg);background:linear-gradient(125deg,#526d5e,#264b43 35%,#153b42 60%,transparent 62%);filter:blur(2px);opacity:.8}.earth:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(100deg,transparent 44%,#0008 83%,#000d)}.stardust{position:absolute;left:-5%;top:50%;width:110%;height:11%;border-top:1px solid #5f98cc35;border-bottom:1px solid #5f98cc25;border-radius:50%;transform:rotate(-3deg);pointer-events:none}.brand,.earth,.stardust{pointer-events:none}#navButtons{position:fixed;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom) + clamp(28px,8vmin,44px));transform:translateX(-50%);width:min(94vw,98vmin,520px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;gap:clamp(2px,1.2vmin,7px)}.orbButton{appearance:none;min-width:0;padding:0 0 2px;border:0;background:transparent;color:#dbeaf7;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 9px/1.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;touch-action:manipulation}.orbShell{position:relative;display:grid;place-items:center;width:var(--le-orb-size-primary);aspect-ratio:1;border-radius:50%;border:1px solid #c7ebff75;background:radial-gradient(circle at 28% 16%,#fff9, #324e68 32%, #020914 76%);box-shadow:inset 2px 2px 5px #fff8,inset -4px -5px 9px #000b,0 0 14px #66caff35}.orbLabel{font-size:10px;text-shadow:0 2px 8px #000}.orbImage{font-size:28px}
@media(orientation:landscape){#navButtons{bottom:calc(env(safe-area-inset-bottom) + clamp(14px,4vmin,20px))}}
</style></head><body><div class="brand">LIVE <span>//</span> EARTH</div><div class="earth"><div class="stardust"></div></div><nav id="navButtons" aria-label="Main navigation">
<button class="orbButton" data-view="earth" aria-label="Earth"><span class="orbShell"><span class="orbImage">🌎</span></span><span class="orbLabel">Earth</span></button>
<button class="orbButton" data-view="moon" aria-label="Moon"><span class="orbShell"><span class="orbImage">🌕</span></span><span class="orbLabel">Moon</span></button>
<button class="orbButton" data-view="sun" aria-label="Sun"><span class="orbShell"><span class="orbImage">☀️</span></span><span class="orbLabel">Sun</span></button>
<button class="orbButton" data-view="location" aria-label="Location"><span class="orbShell"><span class="orbImage">📍</span></span><span class="orbLabel">Location</span></button>
<button class="orbButton" data-view="stacks" aria-label="Stacks"><span class="orbShell"><span class="orbImage">🗂️</span></span><span class="orbLabel">Stacks</span></button>
</nav><script src="./view-module-registry.js"></script><script>window.addEventListener('live-earth-feature-views-ready',()=>document.querySelector('#navButtons [data-view="stacks"]')?.click(),{once:true}); setTimeout(()=>{if(!window.LiveEarthFeatureViews?.isLibraryOpen())document.querySelector('#navButtons [data-view="stacks"]')?.click()},900);</script></body></html>
