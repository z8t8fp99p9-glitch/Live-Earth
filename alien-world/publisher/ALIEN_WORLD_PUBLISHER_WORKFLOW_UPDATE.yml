name: Alien World Live Feed Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '45 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: alien-world-live-feed-pipeline
  cancel-in-progress: false

jobs:
  publish-live-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: editorial-engine/requirements.txt

      - name: Restore the Alien World source database
        uses: actions/cache@v4
        with:
          path: .publisher-data/alien-world/
          key: alien-world-db-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            alien-world-db-v1-${{ runner.os }}-

      - name: Install Collector and shared Editorial Engine dependencies
        run: python -m pip install --disable-pip-version-check -r editorial-engine/requirements.txt

      - name: Collect approved NASA sources
        shell: bash
        run: |
          set -euo pipefail
          python alien-world/collector/collector.py \
            | tee "$RUNNER_TEMP/alien-world-collection-result.json"

      - name: Publish the Live Feed only
        shell: bash
        run: |
          set -euo pipefail
          python alien-world/publisher/publisher.py --mode live \
            | tee "$RUNNER_TEMP/alien-world-live-publisher-result.json"

      - name: Commit only the completed Live Feed
        id: publish_commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s alien-world/published/live-feed.json ]]; then
            echo "Publisher produced no valid live-feed.json output." >&2
            exit 3
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- alien-world/published/live-feed.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No live-feed changes; the last-good feed remains in place."
          else
            git commit -m "Publish Alien World live feed"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages rebuild for a changed Live Feed
        if: steps.publish_commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request(
              'POST /repos/{owner}/{repo}/pages/builds',
              { owner: context.repo.owner, repo: context.repo.repo }
            );
            core.info(`GitHub Pages rebuild requested (HTTP ${response.status}).`)
